<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>반응형 메뉴</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }

            a{
                text-decoration: none;
                color: black;
            }

            #mob_menu {
                display: none;
            }

            #wrap {
                width: 100%;
            }

            

            

            @media screen and (min-width: 1200px) {
                header {
                    width: 100%;
                    height: 100px;
                    background-color: gold;
                }
            
                #in_header {
                    width: 1200px;
                    height: 100px;
                    margin: 0 auto;
                }
                #logo {
                    width: 200px;
                    height: 100px;
                    float: left;
                    text-align: center;
                    font: bold 50px / 100px '';
                    background-color: black;
                    color: white;
                }
                #menu_wrap {
                    width: 800px;
                    height: 100px;
                    float: right;
                }
                #menu_wrap li {
                    width: 25%;
                    height: 100px;
                    font: bold 20px / 100px '';
                    text-align: center;
                    border: 1px solid rgb(255, 255, 255);
                    float: left;
                    box-sizing: border-box;
                }
                
                #mob {
                    display: none;
                }
            }
            
            @media screen and (min-width:760px) and (max-width:1199px){
                header {
                    width: 100%;
                    height: 150px;
                    background-color: gold;
                }
            
                #in_header {
                    width: 750px;
                    height: 100%;
                    margin: 0 auto;
                }
                #logo {
                    width: 150px;
                    height: 80px;
                    text-align: center;
                    font: bold 40px / 80px '';
                    background-color: black;
                    color: white;
                    margin: 0 auto;

                }
                #menu_wrap {
                    width: 750px;
                    height: 50px;
                    margin: 10 auto;
                }
                #menu_wrap li {
                    width: 25%;
                    height: 50px;
                    font: bold 20px / 50px '';
                    text-align: center;
                    float: left;
                }
                
                #mob {
                    display: none;
                }
            }

            @media screen and (max-width:759px){
                header {
                    width: 100%;
                    height: 100px;
                    background-color: gold;
                }
            
                #in_header {
                    width: 90%;
                    height: 100%;
                    margin: 0 auto;
                    position: relative;
                }
                #logo {
                    width: 150px;
                    height: 100px;
                    text-align: center;
                    font: bold 40px / 100px '';
                    background-color: black;
                    color: white;
                    float: left;

                }
                #menu_wrap {
                    width: 750px;
                    height: 50px;
                    margin: 10 auto;
                    display: none;
                }
                #menu_wrap li {
                    width: 25%;
                    height: 100px;
                    font: bold 20px / 100px '';
                    text-align: center;
                    float: left;
                }
                
                #mob {
                    display: block;
                    
                }

                #btn {
                    display: none;
                }

                #label {
                    width: 60px;
                    height: 60px;
                    float: right;
                    display: block;
                    font: 900 50px / 60px '';
                }

                #mob_list {
                    width: 100%;
                    height: 0;
                    overflow: hidden;
                    background-color: aquamarine;
                    top: 100px;
                    transition: 0.5s;
                }

                #mob_list li {
                    width: 100%;
                    height: 80px;
                    background-color: blueviolet;
                    border: 1px solid black;
                    font: 40px / 80px '';
                    text-align: center;
                    box-sizing: border-box;

                }

                #btn:checked~#mob_list {
                    height: 320px;
                }


            }








        </style>
    </head>
    <body>
        <div id="wrap">
            <header>
                <div id="in_header">
                    <div id="logo">LOGO</div>
                    <ul id="menu_wrap">
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                    </ul>
                    
                  

                    <div id="mob">
                        <input type="checkbox" id="btn">
                        <label for="btn" id="label">=</label>
                        <ul id="mob_list">
                            <li><a href="#">menu</a></li>
                            <li><a href="#">menu</a></li>
                            <li><a href="#">menu</a></li>
                            <li><a href="#">menu</a></li>
                        </ul>
                    </div>
                </div>
            </header>
        </div>
    </body>
</html>
