<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>알록달록 무한 슬라이드</title>

    <style>
        /* =========================================
       기본 설정
       ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #dcdcdc;
            overflow: hidden;
        }


        /* =========================================
       슬라이드 영역
       ========================================= */

        .slider {
            width: 100%;
            overflow: hidden;
            padding: 20px 0;
        }


        /* =========================================
       움직이는 전체

       두 개의 group이 이어져 있음
       ========================================= */

        .track {
            display: flex;
            width: max-content;

            animation: moveLeft 30s linear infinite;
        }


        /* =========================================
       한 세트

       화면에 박스 4개

       마지막 박스와 다음 세트 사이에도
       12px 간격이 생기도록 오른쪽 padding
       ========================================= */

        .group {
            display: flex;

            width: calc(100vw + 12px);

            gap: 12px;

            padding-right: 12px;

            flex-shrink: 0;
        }


        /* =========================================
       박스

       기존 디자인 비율
       115 : 160

       화면에 4개 들어가도록 계산
       ========================================= */

        .box {
            position: relative;

            width: calc((100vw - 36px) / 4);

            aspect-ratio: 115 / 160;

            flex-shrink: 0;

            background: #eef2f8;

            border: 4px solid #000;

            overflow: hidden;
        }


        /* =========================================
       알록달록한 원들

       원래 박스가 115px일 때의 디자인을
       현재 박스 크기에 맞춰 비율로 확대

       기준:
       원 크기 = 34 / 115
       ========================================= */

        .colors {
            position: absolute;

            /*
        원래:
        left  = 7px
        top   = 8px

        현재 박스 크기에 맞춰 비율 확대
      */

            left: calc((100vw - 36px) * 0.0152174);
            top: calc((100vw - 36px) * 0.0173913);

            width: calc((100vw - 36px) * 0.2065217);
            height: calc((100vw - 36px) * 0.1695652);
        }


        /* =========================================
       각각의 알록달록 원
       ========================================= */

        .circle {
            position: absolute;

            /*
        원래 34px / 115px
        비율 유지
      */

            width: calc((100vw - 36px) * 0.073913);

            height: calc((100vw - 36px) * 0.073913);

            border-radius: 50%;
        }


        /* =========================================
       파란색 원

       원래 위치:
       left 0
       top 20
       ========================================= */

        .c1 {
            background: #1828d8;

            left: 0;

            top: calc((100vw - 36px) * 0.043478);
        }


        /* =========================================
       분홍색 원

       원래:
       left 24
       top 0
       ========================================= */

        .c2 {
            background: #c438c9;

            left: calc((100vw - 36px) * 0.052174);

            top: 0;
        }


        /* =========================================
       민트색 원

       원래:
       left 46
       top 14
       ========================================= */

        .c3 {
            background: #79d8d0;

            left: calc((100vw - 36px) * 0.1);

            top: calc((100vw - 36px) * 0.030435);
        }


        /* =========================================
       노란색 원

       원래:
       left 20
       top 34
       ========================================= */

        .c4 {
            background: #f4d62f;

            left: calc((100vw - 36px) * 0.043478);

            top: calc((100vw - 36px) * 0.073913);
        }


        /* =========================================
       빨간색 원

       원래:
       left 0
       top 47
       ========================================= */

        .c5 {
            background: #f05a78;

            left: 0;

            top: calc((100vw - 36px) * 0.102174);
        }


        /* =========================================
       회색 원

       원래:
       left 30
       top 45
       ========================================= */

        .c6 {
            background: #d4d4d4;

            left: calc((100vw - 36px) * 0.065217);

            top: calc((100vw - 36px) * 0.097826);
        }


        /* =========================================
       하늘색 원

       원래:
       left 57
       top 46
       ========================================= */

        .c7 {
            background: #3c9fe9;

            left: calc((100vw - 36px) * 0.123913);

            top: calc((100vw - 36px) * 0.1);
        }


        /* =========================================
       아래쪽 회색 원

       원래 크기:
       39px

       박스 115px 기준으로 비율 유지
       ========================================= */

        .gray-circle {
            position: absolute;

            left: calc((100vw - 36px) * 0.021739);

            bottom: calc((100vw - 36px) * 0.026087);

            width: calc((100vw - 36px) * 0.084783);

            height: calc((100vw - 36px) * 0.084783);

            border: calc((100vw - 36px) * 0.004348) solid #aaa;

            border-radius: 50%;

            background: #ddd;
        }


        /* =========================================
       회색 원 안의 대각선

       원래:
       width 43px
       left -4px
       top 16px

       전부 같은 비율로 확대
       ========================================= */

        .gray-circle::after {
            content: "";

            position: absolute;

            width: calc((100vw - 36px) * 0.093478);

            height: calc((100vw - 36px) * 0.004348);

            left: calc((100vw - 36px) * -0.008696);

            top: calc((100vw - 36px) * 0.034783);

            background: #aaa;

            transform: rotate(-25deg);
        }


        /* =========================================
       왼쪽으로 이동

       group 하나의 실제 너비가
       정확히 100vw + 12px이므로

       -50% = 정확히 한 세트 이동
       ========================================= */

        @keyframes moveLeft {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }

        }
    </style>
</head>
