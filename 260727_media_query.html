<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>media query</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            .box {
                width: 300px;
                height: 100px;
                border: 10px solid black;
                box-sizing: border-box;
                margin-bottom: 50px;
                font-size: 25px;
            }

            @media screen and (min-width: 1200px) {
                #pc{ 
                    background-color: blue;
                }
            }

            @media screen and (min-width: 960px) and (max-width: 1199px) {
                #note{ 
                    border-color: red;
                }
            }
            @media screen and (min-width: 760px) and (max-width: 959px) {
                #tab{ 
                    height: 500px;;
                }
            }

            @media screen and (max-width: 759px) {
                #mob{ 
                    width: 100%;
                }
            }

        </style>
    </head>    
    <body>
        <div class="box" id="pc">1200px까지 배경색 파란색</div>
        <div class="box" id="note">960~1199px 테두리 빨간색</div>
        <div class="box" id="tab">760~959px까지 높이 500</div>
        <div class="box" id="mob">모바일사이즈 가로100%</div>
        
    </body>
</html>



<!-- 
    <media query>
    반응형 : 각 디바이스 기기마다 크기가 다 다름
    => 내가 만든 레이아웃 디자인이 변함없이 화면 크기와 비율에 맞게 줄어들도록 작업
    => 화면의 해상도에 따라 페이지를 다르게 구현

    미디어쿼리
    => 화면의 해상도에 따라 각각 페이지를 다르게 표시

    @media 미디어유형 and (조건1) and (조건2) {
        선택자{
            속성 : 속성값;
        }
    }


    <미디어유형>
    => all : 모든 미디어 장치 (기본값)
    => screen : 컴퓨터, 태블릿, 모바일 등
    => print : 인쇄기기

    <조건>
    max-width : 최대 허용되는 가로너비
    min-width : 최소 허용되는 가로너비
    
    <기기 사이즈>
    1) pc : 1200px ~ 
    2) 노트북 : 960px ~ 1199px
    3) 태블릿 : 760px ~ 959px
    4) 모바일 :       ~ 759px

    <주의사항>
    => 전체 화면을 볼 때 브라우저화면 축소하거나 너무 확대하지 않기
    => media 조건 사이에 띄어쓰기 필수
    => 1픽셀에도 반응하기 때문에 1px 줄이는것 잊지 않기
    => 미디어쿼리 구문 안에 들어가지 않는 요소는 화면이 어떤 사이즈가 되든 바뀌지 않음
    => 초기값은 미디어쿼리 구문 밖에 입력
-->
