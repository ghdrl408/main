name: Deploy portfolio and projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'gatcha-pick/**'
      - 'lotus-festival/**'
      - 'last/Font/**'
      - '.github/workflows/deploy-portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare portfolio pages
        run: |
          mkdir -p _site/portfolio
          rsync -a --exclude='test.html' --exclude='내일_작업메모.md' portfolio/ _site/portfolio/
          node <<'NODE'
          const fs = require('node:fs');
          const pagePath = '_site/portfolio/aboutMe.html';
          let html = fs.readFileSync(pagePath, 'utf8');
          const immediateNoteTransitions = ['tvRidingVideo', 'tvGachaVideo', 'tvLotusVideo', 'tvEmojiVideo'];
          for (const video of immediateNoteTransitions) {
            const oldStart = `const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);\n\n                startTvNoiseOverlay(() => {\n                    animateProjectNoteOutForChannelChange();`;
            const newStart = `const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);\n\n                startTvNoiseOverlay(() => {`;
            if (!html.includes(oldStart)) throw new Error(`Could not find ${video} channel transition`);
            html = html.replace(oldStart, newStart);
          }
          const noiseOverlayAnchor = 'const startTvNoiseOverlay = (onNoiseReady, outgoingVideo, nextFrameReady) => {';
          if (html.split(noiseOverlayAnchor).length - 1 !== 1) throw new Error('Could not isolate the channel noise overlay');
          html = html.replace(noiseOverlayAnchor, `let projectNoteChannelTurnPromise = Promise.resolve();\n          ${noiseOverlayAnchor.replace('nextFrameReady) => {', 'nextFrameReady, onNoiseActivated) => {')}`);
          const activateNoiseAnchor = 'tvNoiseVideo.classList.add(\'is-active\');';
          if (html.split(activateNoiseAnchor).length - 1 !== 1) throw new Error('Could not find the channel noise activation point');
          html = html.replace(activateNoiseAnchor, `${activateNoiseAnchor}\n                    onNoiseActivated?.();`);
          const channelOverlayCalls = ['tvRidingVideo', 'tvGachaVideo', 'tvLotusVideo', 'tvEmojiVideo'];
          for (const video of channelOverlayCalls) {
            const callAnchor = `}, outgoingVideo, nextVideoReady);`;
            const videoIndex = html.indexOf(`const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);`);
            const callIndex = html.indexOf(callAnchor, videoIndex);
            if (videoIndex < 0 || callIndex < 0) throw new Error(`Could not wire ${video} note turn to noise activation`);
            html = html.slice(0, callIndex) + '}, outgoingVideo, nextVideoReady, animateProjectNoteOutForChannelChange);' + html.slice(callIndex + callAnchor.length);
          }
          const noiseRevealGuard = 'if (!activated || !minimumNoiseElapsed || !nextFrameAvailable || transitionRevealed ||';
          if (html.split(noiseRevealGuard).length - 1 !== 1) throw new Error('Could not find the noise reveal guard');
          const noteTurnStart = 'const animateProjectNoteOutForChannelChange = () => {';
          const noteTurnEnd = '\n            const startTvRide = () => {';
          const noteTurnStartIndex = html.indexOf(noteTurnStart);
          const noteTurnEndIndex = html.indexOf(noteTurnEnd, noteTurnStartIndex);
          if (noteTurnStartIndex < 0 || noteTurnEndIndex < 0) throw new Error('Could not isolate the channel note transition');
          let noteTurnBlock = html.slice(noteTurnStartIndex, noteTurnEndIndex);
          noteTurnBlock = noteTurnBlock.replace(
            noteTurnStart,
            `${noteTurnStart}\n                let resolveProjectNoteChannelTurn;\n                projectNoteChannelTurnPromise = new Promise((resolve) => { resolveProjectNoteChannelTurn = resolve; });`
          );
          const emptyNoteTurnBranch = `                    resetProjectNoteToFirstPage();\n                    return;`;
          if (!noteTurnBlock.includes(emptyNoteTurnBranch)) throw new Error('Could not find the empty note transition branch');
          noteTurnBlock = noteTurnBlock.replace(
            emptyNoteTurnBranch,
            `                    resetProjectNoteToFirstPage();\n                    resolveProjectNoteChannelTurn();\n                    return projectNoteChannelTurnPromise;`
          );
          const staleTurnLoad = '                        !projectNote.classList.contains(\'is-turning\')) return;';
          if (!noteTurnBlock.includes(staleTurnLoad)) throw new Error('Could not find the stale note load guard');
          noteTurnBlock = noteTurnBlock.replace(staleTurnLoad, '                        !projectNote.classList.contains(\'is-turning\')) { resolveProjectNoteChannelTurn(); return; }');
          const loadedTurnDuration = 'loadProjectNoteTurnMotion(turnDirection, fromPage).then((turnDurationMs) => {';
          if (!noteTurnBlock.includes(loadedTurnDuration)) throw new Error('Could not find the loaded note turn duration');
          noteTurnBlock = noteTurnBlock.replace(
            loadedTurnDuration,
            `${loadedTurnDuration}\n                    const synchronizedTurnDurationMs = turnDurationMs;\n                    projectNoteTurnMotion.style.setProperty('--project-note-turn-duration', \`${'${synchronizedTurnDurationMs}'}ms\`);`
          );
          const timerEnd = '}, turnDurationMs);';
          if (!noteTurnBlock.includes(timerEnd)) throw new Error('Could not find the note turn completion timer');
          const staleTurnTimer = 'if (turnRequestGeneration !== projectNoteTurnRequestGeneration) return;';
          const staleTurnTimerIndex = noteTurnBlock.lastIndexOf(staleTurnTimer);
          if (staleTurnTimerIndex < 0) throw new Error('Could not find the stale note timer guard');
          noteTurnBlock = noteTurnBlock.slice(0, staleTurnTimerIndex) +
            'if (turnRequestGeneration !== projectNoteTurnRequestGeneration) { resolveProjectNoteChannelTurn(); return; }' +
            noteTurnBlock.slice(staleTurnTimerIndex + staleTurnTimer.length);
          noteTurnBlock = noteTurnBlock.replace(timerEnd, '                        resolveProjectNoteChannelTurn();\n                    }, synchronizedTurnDurationMs);');
          const noteTurnBlockTrimmedEnd = noteTurnBlock.trimEnd();
          const noteTurnClosingIndex = noteTurnBlockTrimmedEnd.lastIndexOf('            };');
          if (noteTurnClosingIndex < 0 || noteTurnClosingIndex < noteTurnBlockTrimmedEnd.length - 20) {
            throw new Error('Could not find the end of the channel note transition');
          }
          noteTurnBlock = noteTurnBlockTrimmedEnd.slice(0, noteTurnClosingIndex) +
            '                return projectNoteChannelTurnPromise;\n            };';
          html = html.slice(0, noteTurnStartIndex) + noteTurnBlock + html.slice(noteTurnEndIndex);
          const uncachedNoteMotionFetch = 'fetch(`${path}?v=page-turn-speed-20261123`).then((response) => response.ok ? response.blob() : null)';
          if (html.split(uncachedNoteMotionFetch).length - 1 !== 1) throw new Error('Could not isolate the note motion fetch');
          const versionedNoteMotionFetch = 'fetch(`${path}?v=note-motion-800-20261126`).then((response) => response.ok ? response.blob() : null)';
          html = html.replace(
            uncachedNoteMotionFetch,
            '(Promise.resolve(window.__deployNoteTurnPrefetches?.get(path)).then((prefetchedBlob) => prefetchedBlob ?? ' + versionedNoteMotionFetch + '))'
          );
          const deferredDetailReveal = 'projectNoteDetailsTimer = window.setTimeout(showProjectNoteDetails, 850);';
          if (html.split(deferredDetailReveal).length - 1 !== 4) throw new Error('Expected four delayed channel note reveals');
          html = html.replaceAll(deferredDetailReveal, 'projectNoteDetailsTimer = window.setTimeout(showProjectNoteDetails, 0);');
          const animatedIntroPromptDelay = 'if (elapsed >= 1000) {';
          if (html.split(animatedIntroPromptDelay).length - 1 !== 1) throw new Error('Could not isolate the first-visit note prompt timing');
          html = html.replace(animatedIntroPromptDelay, "if (elapsed >= (window.matchMedia('(min-width: 768px)').matches ? 700 : 1000)) {");
          const modalClickAnchor = `item.addEventListener('click', () => {\n                    noteProcessLastTrigger = item;`;
          if (html.split(modalClickAnchor).length - 1 !== 1) throw new Error('Could not isolate the process image modal click');
          html = html.replace(
            modalClickAnchor,
            `item.addEventListener('click', async () => {\n                    noteProcessLastTrigger = item;\n                    const modalOriginalSources = [item.dataset.mobileOriginal || item.dataset.original, item.dataset.originalSecondary].filter(Boolean);\n                    await Promise.all(modalOriginalSources.map((source) => window.__deployWarmNoteProcessOriginal?.(source) ?? Promise.resolve(false)));\n                    if (noteProcessLastTrigger !== item) return;`
          );
          const modalOpenAnchor = "                    noteProcessModal.classList.add('is-open');";
          if (html.split(modalOpenAnchor).length - 1 !== 1) throw new Error('Could not isolate the process modal opening point');
          html = html.replace(
            modalOpenAnchor,
            `                    await Promise.all([noteProcessModalImage, noteProcessModalSecondaryImage].map((image) => typeof image.decode === 'function' ? image.decode().catch(() => {}) : Promise.resolve()));\n                    if (noteProcessLastTrigger !== item) return;\n${modalOpenAnchor}`
          );
          const preloader = `
          <script id="deploy-note-turn-prefetch">
          (() => {
            const note = document.querySelector('#project-note');
            if (!note) return;
            const warmedMotionBlobs = window.__deployNoteTurnPrefetches ||= new Map();
            const warmedProcessOriginals = window.__deployNoteProcessOriginals ||= new Map();
            const warmedPaths = new Set();
            const warmProcessOriginal = (source) => {
              if (!source) return Promise.resolve(false);
              const url = new URL(source, document.baseURI).href;
              if (warmedProcessOriginals.has(url)) return warmedProcessOriginals.get(url);
              const image = new Image();
              image.decoding = 'async';
              const ready = new Promise((resolve) => {
                let settled = false;
                const finish = async (loaded) => {
                  if (settled) return;
                  settled = true;
                  try { if (loaded && typeof image.decode === 'function') await image.decode(); } catch {}
                  resolve(loaded && image.naturalWidth > 0);
                };
                image.addEventListener('load', () => void finish(true), { once: true });
                image.addEventListener('error', () => void finish(false), { once: true });
                image.src = url;
                if (image.complete) void finish(image.naturalWidth > 0);
              });
              warmedProcessOriginals.set(url, ready);
              return ready;
            };
            window.__deployWarmNoteProcessOriginal = warmProcessOriginal;
            const warmPath = (path) => {
              const url = path + '?v=note-motion-800-20261126';
              if (warmedPaths.has(path)) return;
              warmedPaths.add(path);
              warmedMotionBlobs.set(path, fetch(url)
                .then((response) => response.ok ? response.blob() : null)
                .catch(() => {
                  warmedPaths.delete(path);
                  warmedMotionBlobs.delete(path);
                  return null;
                }));
            };
            const warmChannelTurn = () => {
              const wide = window.matchMedia('(max-width: 1024px)').matches;
              warmPath(wide
                ? 'pf_img/proImg/넓은 메모지 오른쪽넘김_공통속도.gif'
                : 'pf_img/proImg/메모지 오른쪽넘김.gif');
            };
            const warmPreviousTurn = () => {
              if (!note.classList.contains('is-details-visible')) return;
              const wide = window.matchMedia('(max-width: 1024px)').matches;
              warmPath(wide
                ? 'pf_img/proImg/넓은 메모지 왼쪽넘김_공통속도.gif'
                : 'pf_img/proImg/메모지 왼쪽넘김.gif');
            };
            const warmProjectProcessOriginals = () => {
              if (!note.classList.contains('is-gacha-project') && !note.classList.contains('is-emoji-project')) return;
              note.querySelectorAll('.note-process-item').forEach((item) => {
                void warmProcessOriginal(item.dataset.mobileOriginal || item.dataset.original);
                void warmProcessOriginal(item.dataset.originalSecondary);
              });
            };
            note.addEventListener('click', (event) => {
              if (!event.target.closest('#project-note-turn-hotspot') ||
                  (!note.classList.contains('is-gacha-project') && !note.classList.contains('is-emoji-project'))) return;
              const spread = window.matchMedia('(max-width: 1024px)').matches
                ? 'pro_scd/넓은 양쪽 메모지 '
                : 'pro_scd/양쪽 메모지 ';
              warmPath(spread + '왼쪽넘김.gif');
              warmPath(spread + '오른쪽넘김.gif');
            }, true);
            const observer = new MutationObserver(() => {
              warmPreviousTurn();
              warmProjectProcessOriginals();
            });
            observer.observe(note, { attributes: true, subtree: true, attributeFilter: ['class', 'data-original', 'data-mobile-original', 'data-original-secondary'] });
            window.addEventListener('resize', () => {
              warmChannelTurn();
              warmPreviousTurn();
              warmProjectProcessOriginals();
            });
            warmChannelTurn();
            warmPreviousTurn();
            warmProjectProcessOriginals();
          })();
          </script>
          `;
          if (!html.includes('</body>')) throw new Error('aboutMe.html has no closing body tag');
          fs.writeFileSync(pagePath, html.replace('</body>', preloader + '\n</body>'), 'utf8');
          NODE
          if ! command -v gifsicle >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gifsicle ffmpeg
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          gifsicle --batch --optimize=3 --lossy=60 --resize-width 800 --resize-method mix \
            '_site/portfolio/pf_img/proImg/넓은 메모지 오른쪽넘김_공통속도.gif'
          gifsicle --batch --optimize=3 --lossy=60 \
            '_site/portfolio/pf_img/proImg/메모지 오른쪽넘김.gif'
          stat -c '%n %s bytes' \
            '_site/portfolio/pf_img/proImg/넓은 메모지 오른쪽넘김_공통속도.gif' \
            '_site/portfolio/pf_img/proImg/메모지 오른쪽넘김.gif'
          find _site/portfolio -type f -iname '*.mp4' -print0 | while IFS= read -r -d '' video; do
            optimized="${video%.*}.optimized.mp4"
            width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 "$video")
            if (( width > 1920 )); then
              ffmpeg -hide_banner -loglevel error -y -i "$video" -an -sn -dn \
                -vf "fps=15,scale=w='min(1280,iw)':h='min(720,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
                -c:v libx264 -preset fast -crf 30 -pix_fmt yuv420p -movflags +faststart "$optimized"
            else
              ffmpeg -hide_banner -loglevel error -y -i "$video" -an -sn -dn \
                -vf "scale=w='min(1280,iw)':h='min(720,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
                -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p -movflags +faststart "$optimized"
            fi
            mv "$optimized" "$video"
            stat -c '%n %s bytes' "$video"
          done
          node <<'NODE'
          const fs = require('node:fs');
          for (const pagePath of ['_site/portfolio/aboutMe.html', '_site/portfolio/mainPage.html']) {
            let html = fs.readFileSync(pagePath, 'utf8');
            html = html.replace(/(<video\b[^>]*\bsrc="[^"]+\.mp4)(?=")/gi, '$1?v=video-optimized-20261126');
            if (pagePath.endsWith('mainPage.html')) {
              html = html.replace(/(<video\b[^>]*\bid="bg-video(?:-2|-3)?"[^>]*)(>)/gi, (tag, open, close) =>
                /\bpreload=/.test(open) ? tag : `${open} preload="none"${close}`
              );
            }
            fs.writeFileSync(pagePath, html, 'utf8');
          }
          NODE
          mkdir -p _site/gatcha-pick _site/lotusFes _site/Font _site/last/Font
          rsync -a --exclude='*.md' --exclude='*.mp4' --exclude='*참고*' gatcha-pick/ _site/gatcha-pick/
          rsync -a lotus-festival/ _site/lotusFes/
          rsync -a last/Font/ _site/Font/
          rsync -a last/Font/ _site/last/Font/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=portfolio/mainPage.html">
            <title>LKJoo Portfolio</title>
          </head>
          <body>
            <script>location.replace("portfolio/mainPage.html");</script>
          </body>
          </html>
          EOF
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
