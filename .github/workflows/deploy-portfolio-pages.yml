name: Deploy portfolio and projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'gatcha-pick/**'
      - 'lotus-festival/**'
      - 'last/Font/**'
      - '.github/workflows/deploy-portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare portfolio pages
        run: |
          mkdir -p _site/portfolio
          rsync -a --exclude='test.html' --exclude='내일_작업메모.md' portfolio/ _site/portfolio/
          node <<'NODE'
          const fs = require('node:fs');
          const pagePath = '_site/portfolio/aboutMe.html';
          let html = fs.readFileSync(pagePath, 'utf8');
          const immediateNoteTransitions = [
            ['tvRidingVideo', 'riding'],
            ['tvGachaVideo', 'gacha'],
            ['tvLotusVideo', 'lotus'],
            ['tvEmojiVideo', 'emoji'],
          ];
          for (const [video, project] of immediateNoteTransitions) {
            const oldStart = `const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);\n\n                startTvNoiseOverlay(() => {\n                    animateProjectNoteOutForChannelChange();`;
            const newStart = `animateProjectNoteOutForChannelChange();\n                setProjectNoteProjectForTransition('${project}');\n                const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);\n\n                startTvNoiseOverlay(() => {`;
            if (!html.includes(oldStart)) throw new Error(`Could not find ${project} channel transition`);
            html = html.replace(oldStart, newStart);
            const deferredProjectUpdate = `                    setProjectNoteProjectForTransition('${project}');\n`;
            if (!html.includes(deferredProjectUpdate)) throw new Error(`Could not find deferred ${project} note update`);
            html = html.replace(deferredProjectUpdate, '');
          }
          const preloader = `
          <script id="deploy-note-turn-prefetch">
          (() => {
            const note = document.querySelector('#project-note');
            if (!note) return;
            const warmedPaths = new Set();
            const warmPath = (path) => {
              const url = path + '?v=page-turn-speed-20261123';
              if (warmedPaths.has(url)) return;
              warmedPaths.add(url);
              fetch(url).catch(() => warmedPaths.delete(url));
            };
            const warmPreviousTurn = () => {
              if (!note.classList.contains('is-details-visible')) return;
              const wide = window.matchMedia('(max-width: 1024px)').matches;
              warmPath(wide
                ? 'pf_img/proImg/넓은 메모지 왼쪽넘김_공통속도.gif'
                : 'pf_img/proImg/메모지 왼쪽넘김.gif');
            };
            note.addEventListener('click', (event) => {
              if (!event.target.closest('#project-note-turn-hotspot') ||
                  (!note.classList.contains('is-gacha-project') && !note.classList.contains('is-emoji-project'))) return;
              const spread = window.matchMedia('(max-width: 1024px)').matches
                ? 'pro_scd/넓은 양쪽 메모지 '
                : 'pro_scd/양쪽 메모지 ';
              warmPath(spread + '왼쪽넘김.gif');
              warmPath(spread + '오른쪽넘김.gif');
            }, true);
            const observer = new MutationObserver(warmPreviousTurn);
            observer.observe(note, { attributes: true, attributeFilter: ['class'] });
            window.addEventListener('resize', warmPreviousTurn);
            warmPreviousTurn();
          })();
          </script>
          `;
          if (!html.includes('</body>')) throw new Error('aboutMe.html has no closing body tag');
          fs.writeFileSync(pagePath, html.replace('</body>', preloader + '\n</body>'), 'utf8');
          NODE
          mkdir -p _site/gatcha-pick _site/lotusFes _site/Font _site/last/Font
          rsync -a --exclude='*.md' --exclude='*.mp4' --exclude='*참고*' gatcha-pick/ _site/gatcha-pick/
          rsync -a lotus-festival/ _site/lotusFes/
          rsync -a last/Font/ _site/Font/
          rsync -a last/Font/ _site/last/Font/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=portfolio/mainPage.html">
            <title>LKJoo Portfolio</title>
          </head>
          <body>
            <script>location.replace("portfolio/mainPage.html");</script>
          </body>
          </html>
          EOF
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
