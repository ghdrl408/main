name: Deploy portfolio and projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'gatcha-pick/**'
      - 'lotus-festival/**'
      - 'last/Font/**'
      - '.github/workflows/deploy-portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare portfolio pages
        run: |
          mkdir -p _site/portfolio
          rsync -a --exclude='test.html' --exclude='내일_작업메모.md' portfolio/ _site/portfolio/
          node <<'NODE'
          const fs = require('node:fs');
          const pagePath = '_site/portfolio/aboutMe.html';
          let html = fs.readFileSync(pagePath, 'utf8');
          const immediateNoteTransitions = [
            ['tvRidingVideo', 'riding', '라이딩부산', '부산 근교의 자연경관을 즐길 수 있는 오토바이 코스 추천 웹사이트'],
            ['tvGachaVideo', 'gacha', '가챠픽', '선택이 어려운 현대인들을 위한 랜덤 뽑기형 추천 서비스'],
            ['tvLotusVideo', 'lotus', '부여가을연꽃축제', '개인 웹 퍼블리싱 실습을 위해 제작한 가상의 축제 홍보 웹페이지'],
            ['tvEmojiVideo', 'emoji', '고양이 웅냐', '고양이 캐릭터 ‘웅냐’의 일상을 담은 움직이는 이모티콘과 캐릭터 굿즈 디자인'],
          ];
          for (const [video, project, title, description] of immediateNoteTransitions) {
            const oldStart = `const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);\n\n                startTvNoiseOverlay(() => {\n                    animateProjectNoteOutForChannelChange();`;
            const newStart = `animateProjectNoteOutForChannelChange();\n                setProjectNoteProjectForTransition('${project}');\n                setTvStaggeredText(tvTitle, ${JSON.stringify(title)}, 0, 19);\n                noteDescriptionLayoutText = ${JSON.stringify(description)};\n                setTvStaggeredText(noteDescription, ${JSON.stringify(description)}, 0, 12);\n                const nextVideoReady = prepareTvChannelVideo(${video}, outgoingVideo);\n\n                startTvNoiseOverlay(() => {`;
            if (!html.includes(oldStart)) throw new Error(`Could not find ${project} channel transition`);
            html = html.replace(oldStart, newStart);
            const deferredProjectUpdate = `                    setProjectNoteProjectForTransition('${project}');\n`;
            if (!html.includes(deferredProjectUpdate)) throw new Error(`Could not find deferred ${project} note update`);
            html = html.replace(deferredProjectUpdate, '');
          }
          const channelFunctionEdits = [
            ['startTvRide', 'startTvGacha', '라이딩부산'],
            ['startTvGacha', 'startTvLotus', '가챠픽'],
            ['startTvLotus', 'startTvEmoji', '부여가을연꽃축제'],
            ['startTvEmoji', 'startTvNextChannel', '고양이 웅냐'],
          ];
          for (const [functionName, nextFunctionName, title] of channelFunctionEdits) {
            const functionStart = `const ${functionName} = () => {`;
            const functionEnd = `\n            const ${nextFunctionName} = () => {`;
            const functionStartIndex = html.indexOf(functionStart);
            const functionEndIndex = html.indexOf(functionEnd, functionStartIndex);
            if (functionStartIndex < 0 || functionEndIndex < 0) throw new Error(`Could not isolate ${functionName}`);
            let functionBlock = html.slice(functionStartIndex, functionEndIndex);
            const deferredTitle = `                    setTvStaggeredText(tvTitle, '${title}', 0, 19);\n`;
            const deferredDescription = '                    updateNoteDescription();\n';
            if (!functionBlock.includes(deferredTitle) || !functionBlock.includes(deferredDescription)) {
              throw new Error(`Could not find deferred ${functionName} note text`);
            }
            functionBlock = functionBlock.replace(deferredTitle, '').replace(deferredDescription, '');
            html = html.slice(0, functionStartIndex) + functionBlock + html.slice(functionEndIndex);
          }
          const noteTurnStart = 'const animateProjectNoteOutForChannelChange = () => {';
          const noteTurnEnd = '\n            const startTvRide = () => {';
          const noteTurnStartIndex = html.indexOf(noteTurnStart);
          const noteTurnEndIndex = html.indexOf(noteTurnEnd, noteTurnStartIndex);
          if (noteTurnStartIndex < 0 || noteTurnEndIndex < 0) throw new Error('Could not isolate the channel note transition');
          let noteTurnBlock = html.slice(noteTurnStartIndex, noteTurnEndIndex);
          const loadedTurnDuration = 'loadProjectNoteTurnMotion(turnDirection, fromPage).then((turnDurationMs) => {';
          if (!noteTurnBlock.includes(loadedTurnDuration)) throw new Error('Could not find the loaded note turn duration');
          noteTurnBlock = noteTurnBlock.replace(
            loadedTurnDuration,
            `${loadedTurnDuration}\n                    const synchronizedTurnDurationMs = Math.min(turnDurationMs, 350);\n                    projectNoteTurnMotion.style.setProperty('--project-note-turn-duration', \`${'${synchronizedTurnDurationMs}'}ms\`);`
          );
          const noteTurnGenerationLine = 'const turnRequestGeneration = ++projectNoteTurnRequestGeneration;';
          if (!noteTurnBlock.includes(noteTurnGenerationLine)) throw new Error('Could not find the note turn request generation');
          noteTurnBlock = noteTurnBlock.replace(
            noteTurnGenerationLine,
            `${noteTurnGenerationLine}\n                let transitionedProject = false;`
          );
          const pendingProjectStart = 'if (pendingProjectNoteProject !== null) {\n                            const nextProject = pendingProjectNoteProject;';
          if (!noteTurnBlock.includes(pendingProjectStart)) throw new Error('Could not find the pending note project update');
          noteTurnBlock = noteTurnBlock.replace(
            pendingProjectStart,
            `${pendingProjectStart}\n                            transitionedProject = true;`
          );
          const pendingTextUpdatesEnd = 'pendingProjectNoteTextUpdates.clear();';
          if (!noteTurnBlock.includes(pendingTextUpdatesEnd)) throw new Error('Could not find the end of pending note text updates');
          noteTurnBlock = noteTurnBlock.replace(
            pendingTextUpdatesEnd,
            `${pendingTextUpdatesEnd}\n                        if (transitionedProject) projectNoteDetailsTimer = window.setTimeout(showProjectNoteDetails, 0);`
          );
          if (!noteTurnBlock.includes('}, turnDurationMs);')) throw new Error('Could not find the note turn completion timer');
          noteTurnBlock = noteTurnBlock.replace('}, turnDurationMs);', '}, synchronizedTurnDurationMs);');
          html = html.slice(0, noteTurnStartIndex) + noteTurnBlock + html.slice(noteTurnEndIndex);
          const detailsModeGuard = "if (!['riding', 'gacha', 'lotus', 'emoji'].includes(tvMode)) return;";
          if (html.split(detailsModeGuard).length - 1 !== 1) throw new Error('Could not isolate the project note details mode guard');
          html = html.replace(detailsModeGuard, "if (!['riding', 'gacha', 'lotus', 'emoji', 'transitioning'].includes(tvMode)) return;");
          const deferredDetailReveal = 'projectNoteDetailsTimer = window.setTimeout(showProjectNoteDetails, 850);';
          if (html.split(deferredDetailReveal).length - 1 !== 4) throw new Error('Expected four delayed channel note reveals');
          html = html.replaceAll(deferredDetailReveal, 'projectNoteDetailsTimer = window.setTimeout(showProjectNoteDetails, 0);');
          const preloader = `
          <script id="deploy-note-turn-prefetch">
          (() => {
            const note = document.querySelector('#project-note');
            if (!note) return;
            const warmedPaths = new Set();
            const warmPath = (path) => {
              const url = path + '?v=page-turn-speed-20261123';
              if (warmedPaths.has(url)) return;
              warmedPaths.add(url);
              fetch(url).catch(() => warmedPaths.delete(url));
            };
            const warmPreviousTurn = () => {
              if (!note.classList.contains('is-details-visible')) return;
              const wide = window.matchMedia('(max-width: 1024px)').matches;
              warmPath(wide
                ? 'pf_img/proImg/넓은 메모지 왼쪽넘김_공통속도.gif'
                : 'pf_img/proImg/메모지 왼쪽넘김.gif');
            };
            note.addEventListener('click', (event) => {
              if (!event.target.closest('#project-note-turn-hotspot') ||
                  (!note.classList.contains('is-gacha-project') && !note.classList.contains('is-emoji-project'))) return;
              const spread = window.matchMedia('(max-width: 1024px)').matches
                ? 'pro_scd/넓은 양쪽 메모지 '
                : 'pro_scd/양쪽 메모지 ';
              warmPath(spread + '왼쪽넘김.gif');
              warmPath(spread + '오른쪽넘김.gif');
            }, true);
            const observer = new MutationObserver(warmPreviousTurn);
            observer.observe(note, { attributes: true, attributeFilter: ['class'] });
            window.addEventListener('resize', warmPreviousTurn);
            warmPreviousTurn();
          })();
          </script>
          `;
          if (!html.includes('</body>')) throw new Error('aboutMe.html has no closing body tag');
          fs.writeFileSync(pagePath, html.replace('</body>', preloader + '\n</body>'), 'utf8');
          NODE
          mkdir -p _site/gatcha-pick _site/lotusFes _site/Font _site/last/Font
          rsync -a --exclude='*.md' --exclude='*.mp4' --exclude='*참고*' gatcha-pick/ _site/gatcha-pick/
          rsync -a lotus-festival/ _site/lotusFes/
          rsync -a last/Font/ _site/Font/
          rsync -a last/Font/ _site/last/Font/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=portfolio/mainPage.html">
            <title>LKJoo Portfolio</title>
          </head>
          <body>
            <script>location.replace("portfolio/mainPage.html");</script>
          </body>
          </html>
          EOF
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
