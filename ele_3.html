<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            * {
                padding: 0;
                margin: 0:
            }

            #wrap {
                width: 1200px;
                height: 800px;
                font-size: 50px;
                margin: 0 auto;
                text-align: center;
                background-color: darkgrey;

            }

            #menu {
                width: 1200px;
                height: 100px;
                background-color: aqua;
                line-height: 100px;

            }

            #fst {
                width: 100%;
                height: 250px;
                background-color: rgb(73, 8, 158);
                color: white;
                margin: 50px 0px;
                line-height: 250px;

            }

            #scd{width: 1200px;
                height: 350px;
                line-height: 350px;
            }

            .c {
                width: 380px;
                height: 350px;
                background-color: aquamarine;
                float: left;
            }
            
            .c:nth-child(2){
                    margin: 0 30px;
            }
            .c:hover {
                background-color: aqua;
            }

            



        </style>
    </head>
    <body>
        
        <div id="wrap">
            <div id="menu">메뉴영역</div>
            <div id="fst">첫번째 섹션</div>
            <div id="scd">
                <div class="c">컨텐츠1</div>
                <div class="c">컨텐츠2</div>
                <div class="c">컨텐츠3</div>
            </div>
        </div>

    </body>
</html>
