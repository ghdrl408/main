<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0%;
            margin: 0;
        }

        /* ul,
        li {
            list-style: none;
        } */

        #out-box {
            width: 200px;
            height: 600px;
            background-color: antiquewhite;
            margin: 100px auto;
        }

        #out-box>li {
            width: 200px;
            height: 100px;
            border: 2px solid gold;
            font: 30px / 100px '';
            box-sizing: border-box;
            text-align: center;
        }

        #out-box a {
            color: white;
            text-decoration: none;
        }

        #out-box>li>ul>li {
            color: aqua;
        }

        #out-box>li>ul>li:nth-child(2)>a {
            background-color: blueviolet;
        }

        .m2 {
            color: blue;
        }

        ul li {
            list-style: none;
        }

        #out {
            width: 400px;
            height: 300px;
            background-color: azure;
            margin: 0 auto;
            text-align: center;

        }

        #out>li>ul {
            background-color: brown;
        }
    </style>
</head>

<body>
    <ul id="out-box">
        <li>자식박스</li>
        <li>
            <a href="#">자식박스</a>
        </li>
        <li>
            <ul>
                <li>자손박스</li>
                <li>
                    <a href="#">자손박스</a>
                </li>
                <li>
                    <a href="#">자손박스</a>
                </li>
            </ul>
        </li>
    </ul>

    <dl>
        <dt>타이틀

        <dd>타이틀설명</dd>
        </dt>
    </dl>

    </li>
    </ul>

    <a href="https://www.youtube.com/" target="_self">타겟</a>




    <ul id="out">
        <li>자식박스
            <ul>
                <li class="m2">자손</li>
                <li>자손</li>
            </ul>
        </li>
        <li class="m2">자식박스</li>
        <li>자식박스</li>
    </ul>
    <dl>
        <dd>2qq</dd>
        <li>12</li>
        <li>33</li>
    </dl>
</body>

</html>
