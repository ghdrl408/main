<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>media query</title>
        <style>

            *{
                padding: 0;
                margin: 0;
            }

            #container {
                background-color: lightblue;
                margin: 50px auto;
                
            }

            .con {
                box-sizing: border-box;
                border: 10px solid black;
                text-align: center;
                font-size: 50px;
                font-weight: bold;
            }

            @media all and (min-width: 1200px) {
                #container {
                    width: 1200px;
                }
                .con {
                    width: 50%;
                    height: 400px;
                    background-color: gold;
                    float: left;
                    line-height: 380px;
                }
            }
            /* pc end */

            @media all and (min-width: 760px) and (max-width: 1199px){
                #container {
                    width: 90%;
                }
                .con {
                    width: 50%;
                    height: 300px;
                    background-color: rgb(255, 0, 0);
                    float: left;
                    line-height: 280px;
                }
            }
            /* tap end */

            @media all and (max-width: 759px){
                #container {
                    width: 100%;
                }
                .con {
                    width: 100%;
                    height: 180px;
                    background-color: rgb(35, 255, 248);
                    line-height: 180px;
                }
            }
        </style>
    </head>    
    <body>
    
        <div id="container">
            <div class="con">1</div>
            <div class="con">2</div>
        </div>

    </body>
</html>
