<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>웹폰트</title>
        
        <style>
            * {
            margin: 0;
            padding: 0;
            }

            a {text-decoration: none;
                color: black;
            }

            li, ul {
            list-style: none;
            }

            #wrap {
                width: 800px;
                height: 1000px;
                background-color: cornflowerblue;
                border: 10px solid black;
                margin: 100px auto;
            }

            header {
                width: 100%;
                height: 100px;
                background-color: goldenrod;
                float: left;
            }

            #logo {
                width: 98.75px;
                height: 100px;
                background-color: palevioletred;
                font: 900 25px / 100px '';
                text-align: center;
                float: left;
            }

            #menu_wrap {
                width: 592.5px;
                height: 100px;
                float: right;
            }

            #menu_wrap li {
                width: 25%;
                height: 100px;
                background-color: pink;
                font: 800 25px / 100px '';
                float: right;
                text-align: center;
                box-sizing: border-box;
                position: relative;
            }

            #menu_wrap li::after {
                width: 0px;
                height: 5px;
                background-color: blueviolet;
                content: '';
                position: absolute;
                width: 0;
                height: 0;
                
            }

            #menu_wrap li:hover {
                background-color: palevioletred;
                transition: 0.3s;
                bottom: 0;
                right: 0;

            }

            #menu_wrap li::after :hover {
                width: 100%;
                bottom: 0;
                right: 0;
            }

            #text {
                width: 100%;
                height: 300px;
                background-color: blueviolet;
                font: 900 30px / 300px '';
                text-align: center;
                float: left;
            }

            #text ::before {
                
            }

            .box {
                width: 100%;
                height: 300px;
                background-color: yellow;
            }
            

        </style>

    </head>
    <body>
        <div id="wrap">
            <header>    
                <div id="logo"><a href="#"></a>LOGO</div>
                <ul id="menu_wrap">
                    <li><a href="#">menu</a></li>
                    <li>menu</li>
                    <li>menu</li>
                    <li>menu</li>
                </ul>
            </header>

            <main>
                <div id="text">언제나 마음은 태양</div>
                <div class="box">
                    <div class="title_box">Title</div>
                    <div class="main_box">내용내용내용내</div>
                </div>
                <div class="box">
                    <div class="title_box">Title</div>
                    <div class="main_box"></div>
                </div>
            </main>
            <footer>
                <div><a href="#">site</a></div>
                <div><a href="#">site</a></div>
                <div><a href="#">site</a></div>
                <div><a href="#">site</a></div>
            </footer>
        </div>
    </body>
</html>
