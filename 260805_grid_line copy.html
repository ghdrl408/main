<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>grid line</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            .container {
                width: 800px;
                height: 800px;
                display: grid;
                grid-template-columns: repeat(3, 1fr) ;
                grid-template-rows: 1fr 1fr 1fr ;
                grid-gap: 10px;
                margin: 50px auto;
                text-align: center;
                font: 30px / 260px '';

            }

            #box1 {
                background-color: teal;
                grid-column: 1/3;
                grid-row: 1/2;
            }

            #box2{
                background-color: lawngreen;
                grid-column: 3/4;
                grid-row: 1/3;
                line-height: 530px;

            }

            
            #box3{
                background-color: rgb(0, 121, 187);
                grid-column: 1/2;
                grid-row: 2/4;
                line-height: 530px;


            }

            
            #box4{
                background-color: rgb(210, 32, 154);
                grid-column: 2/4;
                grid-row: 3/4;
            }

            
            #box5{
                background-color: rgb(239, 198, 92);
                grid-column: 2/3;
                grid-row: 2/3;
            }
            .container_f {
                display: flex ;
                flex-direction: row;
                justify-content: center;
                align-items: center;

            }

            .items_f {
                width: 100px;
                height: 150px;
                margin: 55px auto;
                line-height: 150px;
                color: tomato;
                background-color: rgb(255, 255, 255);
                border: 5px solid rgb(203, 116, 1);
                box-sizing: border-box;

            }

            .items_f:nth-child(2) {
                width: 230px;
                margin: 0 10px;
            }

        </style>

    </head>
    <body>
        <div class="container">
            <div class="items" id="box1">
                <div class="container_f">
                    <div class="items_f">
                        <h2>H</h2>
                    </div>
                    <div class="items_f">
                        <h2>HO</h2>
                    </div>
                    <div class="items_f">
                        <h2>H</h2>
                    </div>
                </div>
            </div>
            <div class="items" id="box2">2</div>
            <div class="items" id="box3">3</div>
            <div class="items" id="box4">4</div>
            <div class="items" id="box5">5</div>
        </div>
    </body>
</html>
