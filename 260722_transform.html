<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>transform</title>
        <style>
            *{
                padding: 0;
                margin: 0; 
            }

            h2 {
                text-align: center;
                width: 100%;
                margin: 100px 0 20px 0;
            }

            .box {
                width: 100px;
                height: 100px;
                border: 5px solid black;
                background-color: lightblue;
                margin: 0 auto;

            }

            .transform {
                width: 100%;
                height: 100%;
                background-color: lightcoral;
                transition: 1s;

            }

            .box:hover .translate {
                transform: translate(100px, -20px);
            }

            .box:hover .rotate {
                transform: rotate(120deg);
            }

            .box:hover .scale {
                transform: scale(2);
            }

            .box:hover .skew {
                transform: skew(1200deg);
            }

            .box1 {
                width: 300px;
                height: 300px;
                background-color: teal;
                margin: 100px auto;
                transition: 3s;
                font: 50px / 300px '';
                text-align: center
            }

            .box1:hover{
                transform: scale(0.3) rotate(360deg);

            }



        </style>
    </head>
    <body>
        <h2>translate</h2>
        <div class="box">
            <div class="translate transform"></div>
        </div>
        <h2>rotate</h2>
        <div class="box">
            <div class="rotate transform"></div>
        </div>
        <h2>scale</h2>
        <div class="box">
            <div class="scale transform"></div>
        </div>
        <h2>skew</h2>
        <div class="box">
            <div class="skew transform"></div>
        </div>

        <div class="box1">test</div>
    </body>
</html>



<!-- 
    <transform>
    - 객체에 위치, 회전, 크기, 기울기의 왜곡 속성 지정
    - transform : 속성값;

    => 2D 변형 : X, Y 축 활용
    => 3D (회전)은 : Z 축 활용

    transform-origin : x축, y축;
    => 동작시 기준점 변경
    => 왼쪽 위 : 0% 0%
    => 오른쪽 아래 : 100% 100%

    x - left, right, center
    x - top, bottom, conter

    속성값 
    1) translate : 위치
        => ranslate (x축px, y축px);
        => 한자리만 입력시 기본적으로 가로값(x축) 적용
        => 기본적으로 부모의 왼쪽 상단을 기준으로 이동
        => 포지션 속성 없이 객체를 옮길 수 있는 속성

    2) rotate : 회전
        => rotate(각도) ex) transform: rotate(135deg); ->deg(degle디글 각도)
    
    3) scale : 크기
        => transform: scale(배율); ex) transform: scale(1.5);
        => 축소는 1보다 숫자를 작게 / 확대는 1보다 숫자를 크게
        => 부모의 중심점이 기준

    4) skew : 기울기
        => transform: skew(각도deg)
        => 각도값에 따라 기울기
        => x축, y축

        ** 속성값을 2개 적용
        transform: translate(x,y);
        transform: rotate(55deg);          ->이렇게 하면 아래꺼만 적용됨(덮어씌움)

        => transform: scale(0.3) rotate(95deg);  -> 두 줄 나열 말고 나란히. 한 칸 띄워쓰기 입력
-->
