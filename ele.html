<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>display</title>
        <style>
            /*  reset css */
            *{
                padding:0;
                margin: 0;
            }

            img {
                display: block;
                border: 0;
                
            }

            #img {
                width: 300px;
                display: none;
            }

            #vis {
                width: 300px;
                height: 300px;
                background-color: aqua;
                visibility: hidden;
            }


            .block {
                width: 300px;
                height: 200px;
                background-color: rgb(151, 151, 216);
                color: white;
                text-align: center;
                line-height: 200px;
                display: inline;
            }

            .inline {
                background-color: hotpink;
                color: white;
                font-size: 50px;
                display: block;
            }

            #op {
                width: 300px;
                height: 300px;
                background-color: brown;
                opacity: 0.1;
            }




        </style>
    </head>
    <body>
        <div class="block">블록요소</div>
        <div class="block">블록요소</div>

        <span class="inline">인라인요소</span>
        <span class="inline">인라인요소</span>

        <img id="img" src="./raccoon.jpg" alt="라쿤">

        <div id="vis">visiblity</div>

        <div id="op">opacity</div>
        










    </body>
</html>

<!-- 
    <display>
    - block : 
        -> 세로 정렬 속성
        -> 크기값(width, hight) 설정
        -> 기본 여백 없음
        <address, article, aside, blockquote, div, figcaption, figure, footer, form, h1, h6
        header, hr, il, main, nav, p, pre, section, table, ul, vidio>

    - inline : 
        -> 가로 정렬 속성
        -> 크기값(width, hight) 설정 불가   -> width(텍스트 내용), hight(font-size)
        -> 기본 여백 있음
        <a, b, big, br, butten, i, input, label, map, object, q, script, select, small
        span, strong, sub, sup, textarea, time, tt>

    - inline-block : 
        -> 박스 모양을 inline(가로)으로 정렬(크기 조절 가능)
        -> block, inline 속성 모두 적용되에 float 값을 넣지 않아도 자동 왼쪽정렬
        -> 박스 사이에 간격이 생기고 간격의 수치를 정확히 알 수 없음
        -> 잘 사용하진 않음
        <img>

        ㄴ> img 태그는 보통 태그 초기화(reset css)할때
            display : block; &  border : 0;

    - none : 
        -> 선택된 개체를 숨김
        -> 코드상에 남아있음 (검사창 열어서 확인)

    <숨김처리시 사용하는 속성>
    - display: none;

    - visibility : hidden;(숨김) / visible;(보이게함)
        -> 객체를 숨기는 속성
        -> 영역이 지정되어있을 경우 영역에 유지된게 보임 
        (검사창 열고 태그에 마우스를 가져다 대거나 태그를 클릭했을 때)

    - opacity : 0;
        -> 투명: 0;
        -> 불투명 : 1;
        -> 반투명 : 0.5;
-->
