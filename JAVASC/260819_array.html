<!-- 
    <배열>
    같은 타입 또는 다른 타입의 여러 데이터를 한 곳에 모아둔 자료구조
    사용 빈도가 매우 높다.

    일련의 데이터를 순서대로 나열하고, 인덱스를 통해 배열 안의 각 요소에 접근

    배열을 사용하는 이유
    => 여러 개의 변수를 사용하지 않고도 데이터 관리, 조작,
    => 데이터를 효율적으로 저장하고, 접근할 수 있게 해 주고,
    => 다양한 메소드를 통해 데이터를 쉽게 조작 가능

    특징
    => 동적 크기 : 필요에 따라 동적으로 크기(=길이)가 변한다.
    => 다양한 타입 허용 : 숫자, 문자열, 객체 등 다양한 타입의 요소를 합께 저장가능
    => 배열에는 내장된 메소드를 가지고 데이터를 쉽게 조작

    인덱스 : 배열의 요소(배열 안에 있는 하나하나의 데이터)는 배열에서 자신의 위치를 나타내는
            0 이상의 정수 (맨 앞자리가 0 이고 0 부터 카운트)

    =>배열명[인덱스번호]


    let arr = []; 
    let arr1 = [0, 2, 6, ...];
    let arr2 = ['곰', '여우', '사자' ...];
    let arr3 = [1, '곰', true, false, ...];
    let arr4 = [[1, 1, 2], ['하마', '독사'], ... ];

    배열의 길이 : = 배열의 크기(1번부터 시작)

    =>배열명.length

-->
