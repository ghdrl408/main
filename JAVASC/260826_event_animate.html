<!-- 
    <이벤트>    
    사용자가 웹 문서 영역에서 마우스 또는 키보드 같은 입력장치로 동작을 하면 결과를 실행하는 명령

    $('선택자').이벤트명령(function() {
        //실행될 코드
    });

    <animate>
    시간에 따른 움직임 또는 애니메이션 작업시 사용
    애니메이트 적용 속성
        - 크기값: width, height
        - 여백값: margin, padding
        - 위치값: left, right, top, bottom (position 필수)
        - 투명도: opasity (0~1)
        - 스크롤 영역값

        $(선택자).animate ({
            속성: 속성값,
        }, 시간, 가속도 형태, 콜백함수);

        => 시간 : 1s => 1000
        => 가속도 형태 : 플러그인 사용
        => 콜백함수 : animate 시작하고 동작 완료 후에 콜백함수로 다음 동작을 실행


-->
