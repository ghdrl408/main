<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>텍스트 크기조절 박스 만들기</title>
        <script src="jqu.js"></script>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            #box {
                width: 300px;
                height: 100px;
                border: 1px solid black;
                border-radius: 5px;
                margin: 100px auto;
                display: flex;
            }

            .btn {
                width: 80px;
                height: 80px;
                background-color: lightgray;
                border-radius: 5px;
                box-sizing: border-box;
                margin: 10px;
                color: gray;
                cursor: pointer;
                user-select: none;
                /* text-align: center;
                font: 900 60px/ 70px ''; */

                /* flex 사용시 */
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 60px;
            }
            
            /*flex 사용시
            
            .min {
                float: left;
            }

            .plu {
                float: right;
            } */
             

            #num {
                /* font:  60px / 70px '';
                float: left;
                margin: 10px 30px; */

                /* flex 사용시 */
                width: 100px;
                height: 100px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 60px;

            }

            #text {
                font-size: 10px;
                text-align: center;
            }




        </style>


    </head>
    <body>
        <!-- 수량체크 -->
        <!-- 문제
            수량 표시 0~10
            전체 사이즈 300 100 테두리 5px둥글기 중앙정렬
            버튼크기 80 80 5px둥글기 배경색 폰트60px
        
            script = 버튼 클릭시 수량 증감
        -->

        
        <div id="box">
            <div class="btn min">&#45;</div>
            <div id="num">0</div>
            <div class="btn plu">&#43;</div>
            
        </div>

        <p id="text">미리보기 텍스트입니다.</p>





        <script>
            $(document).ready(function () {

                /*
                <text()>
                선택자에 텍스트를 입력하는 명령어

                $('선택자').text('텍스트');
                ex) $('#num').text('1'); 
                */

                let num = 0;

                $('.plu').click(function () {
                    if (num > 9) {
                        return; //리턴 뒤에 아무것도 없으면 끝났을때 문 종료
                    }
                    num++;
                    $('#num').text(num);
                    $('#text').css ({
                        fontSize :num * 5 + 10 + 'px',
                    });
                });

                $('.min').click(function () {
                    if (num < 1) {
                        return; //리턴 뒤에 아무것도 없으면 끝났을때 문 종료
                    }
                    num--;
                    $('#num').text(num);
                    $('#text').css({
                    fontSize: num * 5 + 10 + 'px',
                    });
                });






            })
            



        </script>
        
    </body>
</html>
