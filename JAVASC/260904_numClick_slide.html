<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>slide_example</title>
        <script src="jqu.js"></script>
        <script src="jqu_ui.js"></script>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }


            img {
                display: block;
                border: none;
            }
            

        #wrap {
            width: 600px;
            height: 400px;
            border: 10px solid black;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
        }

        #img_wrap {
            width: 3000px;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            
        }

        #img_wrap img {
            width: 600px;
            height: 400px;
            float: left;
        }


        #btn_wrap {
            width: 250px;
            height: 50px;
            position: absolute;
            left: 50%;
            margin-left: -125px;
            bottom: 20px;
            
        }

        #btn_wrap li {
            width: 40px;
            height: 40px;
            background-color: rgb(145, 145, 145);
            border-radius: 50%;
            color: rgb(0, 0, 0);
            text-align: center;
            line-height: 40px;
            float: left;
            margin-right: 5px;
            cursor: pointer;
            user-select: none;
            
        }

        #box_wrap {
            width: 200px;
            height: 100px;
            position: relative;

            
        }
        
        .box {
            width: 100%;
            height: 100%;
            font: 700 20px / 100px '';
            text-align: center;
            margin: 20px;
            position: absolute;
            top: 0;
            left: -250px;
            
        }

        .box:first-child {
            left: 0;
        }

        #btn_wrap .active { 
            background-color: black;
            color: white;
        }


        </style>
    </head>
    <body>

        <div id="wrap">
            
            
            
            <div id="img_wrap">
                <img src="/JAVASC/img/cat_1.jpg" alt="고양이1">
                <img src="/JAVASC/img/cat_2.jpg" alt="고양이2">
                <img src="/JAVASC/img/cat_3.jpg" alt="고양이3">
                <img src="/JAVASC/img/cat_4.jpg" alt="고양이4">
                <img src="/JAVASC/img/cat_5.jpeg" alt="고양이5">
            </div>
            
            <ul id="btn_wrap">
                <li class="active" >1</li>
                <li >2</li>
                <li >3</li>
                <li >4</li>
                <li >5</li>
            </ul>

            <div id="box_wrap">
                <div class="box " >첫번째</div>
                <div class="box">두번째</div>
                <div class="box">세번째</div>
                <div class="box">네번째</div>
                <div class="box">다섯번째</div>
            
            </div>

        </div>

        


        <script>
            $(document).ready(function () {

                let bg = ['lightgreen', 'lightpink', 'lightblue', 'lightgray', 'lightcoral'];

                $('.box').css({
                    backgroundColor: function (i) {
                        return bg[i];
                    }
                });



                $('#btn_wrap li').click(function () {
                    let i = $(this).index();

                    $('#img_wrap').animate ({
                        left: -600 * i,
                    });
                    
                    //버튼 색 변경 이벤트
                    $('#btn_wrap li').removeClass ('active');
                    $(this).addClass('active');

                    //텍스트 박스 가로 방향으로 밖으로 나갔다 들어오기
                    $('.box').eq(i).animate({
                        left: 0,
                    });

                    $('.box').not($('.box').eq(i)).animate({  
                        left: -220,
                    });

                    //not : 이 선택자 (객체) 빼고

                });


               

                





            });

        </script>
        
    </body>
</html>
