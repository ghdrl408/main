<!DOCTYPE html>

        <title>슬라이드 배너</title>

        <style>
            *{
                margin: 0;
                padding: 0;
            }

            img {
                display: block;
                border: 0;

            }

            #wrap {
                width: 600px;
                height: 400px;
                border: 10px solid black;
                margin: 100px auto;
                overflow: hidden;
                position: relative;

            }

            #img_wrap {
                width: 3000px;
                height: 400px;
                position: absolute;
                top: 0;
                left: 0;
            }

            #img_wrap img {
                width: 600px;
                height: 100%;
                float: left;
            }

            .arrow {
                width: 50px;
                height: 50px;
                background-color: rgba(255, 255, 255, 0.519);
                position: absolute;
                top: 50%;
                margin-top: -25px;
                text-align: center;
                line-height: 50px;
                cursor: pointer;
            
            }

            #left {
                left: 0;
            }

            #right {
                right: 0;
            }

                $('#left').click(function () {
