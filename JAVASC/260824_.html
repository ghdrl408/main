        문제
            div 스타일 3개
            => 200*200
            => 상하여백 50px, 중앙정렬
            => 텍스트크기 100px
            => 텍스트 가로세로 중앙정렬
            => 배경색은 순서대로 빨강 초록 파랑          -->
        

        <div >1</div>
        <div >2</div>
        <div >3</div>

        <div id="box">4</div>


        <script>
            $(document).ready(function(){
                $('div').css ({
                    width: 200,
                    height: 200,
                    textAlign: 'center',
                    lineHeight: '180px',
                    fontSize: '100px',
                    margin: '50px auto'

                })

                $('div:nth-child(1)').css({
                    backgroundColor: 'red'
                })

                $('div:nth-child(2)').css({
                    backgroundColor: 'green'
                })

                $('div:nth-child(3)').css({
                    backgroundColor: 'blue'
                })


            let div_w = $('#box').width(); //선택자의 width값을 변수에 담음
            let div_h = $('#box').height(); //선택자의 height값을 변수에 담음

            $('#box').css({
                width : div_w + 600, //=800
                height : div_h - 50, //=150
                backgroundColor : 'gold',
                fontSize : '50px',
                textAlign : 'center',
                lineHeight : div_h - 50 + 'px'
//졸리당
            })
            })

            </script>
                

    </body>
</html>
