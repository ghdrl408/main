        //---------------------------------트랜지션 기초 끝 

        let bg = ['white', 'dimgray'];
        let btnColor = ['dimgray', 'lightgray'];

        let i = 0;
        
        let ww = $(window).width();
        let wh = $(window).height();

        function toggle() {
            $('body').transition ({
                backgroundColor: bg[i],
            },500);

            $('#btn_wrap').transition({
                backgroundColor: btnColor[i],
            },500);
            
            $('#btn').transition({
                x : 100 * i,

                //or
                // translate: [100 * i],
                
                //jq: tranlateX or tranlateY 는 그냥 x, y 로만 적어야 함
            },500);
        }

        $('#btn_wrap').click (function () {
            if (i === 0) {
                i++;
                toggle();
            }else if (i === 1) {
                i--;
                toggle();

            }
        });

        //--------------------------------- 다크모드 토글 끝

                



            });//end
