    <조건문>
    조건을 만족하는 데이터를 실행하고 처리할 때

    - if(조건1) {
        조건1이 만족했을 때 실행 될 코드    
    } else {
        조건1이 거짓일 때 실행될 코드
    }

    -if(조건1) {
        조건1이 만족을 했을 때 실행 될 코드
    } else if(조건2) {
        조건1은 거짓 / 조건2가 만족을 했을 때 실행 될 코드 
    } else {
        조건1, 2 둘 다 거짓일 때 실행 될 코드
    }
