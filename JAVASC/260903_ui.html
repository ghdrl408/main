<!-- 

    <시각효과>

    show(시간) : 왼쪽 상단을 기준으로 크기가 커지면서 보이는 시각 효과
    hide(시간) : 왼쪽 상단을 기준으로 크기가 작아지면서 보이는 시각 효과
    toggle(시간) : show + hide => 클릭을 show 한번 / hide 한번

    slideDown(시간) : 위에서 슬라이드가 내려오면서 보이는 효과
    slideUp(시간) : 위에서 슬라이드가 내려오면서 보이는 효과
    slideToggle(시간) : slideDown + slideUp => 클릭을 한번 한번 각각

    fadeIn(시간) : 투명도 0~1로 변경되면서 서서히 나타나는 효과
    fadeOut(시간) : 투명도 0~1로 변경되면서 서서히 사라지는 효과
    fadeToggle(시간) : fadeIn + fadeOut => 클릭을 한번 한번 각각

    +

    <addClass>
    => 기존 클래스 + 클래스 속성을 추가하는 명령어
    $('선택자').addClass('클래스명'); 
    ex) $('#box').addClass('active');       =>클래스 명에 .안찍어도 됨

    <removeClass>
    => 기존 클래스 + 추가된 클래스 속성을 삭제하는 명령어
    $('선택자').removeClass('클래스명');
    ex) $('#box').removeClass('remove');  

    <toggleClass>
    => 지정된 기존 클래스 값이 있으면 제거, 없으면 추가
    $('선택자').toggleClass('클래스명');
    ex) $('#box').toggleClass('toggle');  

    jqueryui 플러그인 설치 후
    addClass, removeClass 에 시간값 추가 가능
    => 애니메이션 작업 가능

    animate() 의 경우
    => 사용 가능한 속성값이 정해짐
    => 시간차를 두고 색상 변경 불가
    
    addClass, removeClass 로 애니메이션 작업을 하는 경우
    => 기존 css스타일에 대부분 속성값을 활용 가능
    => 시간차를 두고 색상 변경 가능
    => class 속성으로 추가 제거하므로 우선순위 확인 필!
    -> $('선택자').addClass('클래스명', 시간);
