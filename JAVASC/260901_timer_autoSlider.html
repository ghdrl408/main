<!-- 
    <타이머함수>
    1. 브라우저 로드시 지정한 시간 이후 한번만 실행되는 타이머 함수

    => setTimeout(function () {
        //code
    }, 시간); // ->시간 이후로 끝남
    
    crearTimeout(id); =>setTimeout 함수 삭제


    2. 브라우저 로드시 지정한 시간 이후 마다 계속 실행되는 타이머 함수 (지정한 시간 간격마다)

    => setInterval(function () {
        //code
    }, 시간);
    
    clearInterval(id) => 시간 이후 setInterval 함수 삭제
        =>  setTimeout(function () {
            clearInterval(함수이름);
            }, 시간);

    .trigger() : 사용자가 이벤트를 실행하는 것 처럼 이벤트를 강제로 실행

        $('선택자').trigger('명령')         //명령에는 보통 click이 많이 들어간다 함
