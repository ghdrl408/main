<!-- 
    <return>
    return a + b
    return 값; 이 있으면 그 값의 결과를 반환

    함수 내부에 return 이 있으면 함수는 종료되고 더이상 실행되지 않음
    => 여러 조건 중 원하는 조건 만족시 함수를 종료시키고 나머지 조건을 실행하지 않을때 사용
    return;

    <선택자>
    - 부모요소 선택자
    $('선택자').parent().명령();

    - 자식요소 선택자
    $('선택자').children().명령();

    - 전후요소 선택자 (앞뒤)
    $('선택자').prev().명령();
    $('선택자').next().명령();

    - 종속선택자
    ex ) h2 class = subtitle

    h2.subtitle => h2 태그 중에 subtitle 이라는 클래스 값을 가진 애들 다 선택

    $('요소#아이디명').명령();
    $('요소.클래스명').명령();

    <선택자>
    따옴표를 붙이지 않아도 되는 선택자 => document, window, this
    => 컴퓨터에 지정된 기존 선택자라 따옴표 필요없음

    window : 웹 브라우저에 대한 선택자

-->
