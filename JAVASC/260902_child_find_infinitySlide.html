                    $('#img_wrap').animate({

                        $('#img_wrap').css ({

                    $('#img_wrap').animate({
                        left: 0,
                    }, 1000, function () {
                        $('#img_wrap').css({
                            left: -wrap_width,
                        }).find('.img').last().prependTo('#img_wrap'); //마지막 자식이 맨 앞으로 이동

<!-- 

    <nth-child(n)>
    => .eq(index) => index 는 0부터 시작
        eq는 명령어

        ver.1 첫번째 자식 선택
    $('#box:first-child').css ({
        backgroundColor : 'tomato',    
    });

        ver.2
    $('#box').first().css ({
        backgroundColor : 'tomato',
    });


        ver.3
        $('#box').eq(0).css ({           //eq 배열 안의 (0)(i인덱스)첫번째 자식
            backgroundColor : 'tomato',
        });

    ex) <div id="parents">
            <div class="child">1</div>
            <div class="child">2</div>
            <div class="child">3</div>
            <div class="child">4</div>
            <div class="child">5</div>
            <div class="child">6</div>
            <div class="child">7</div>
        </div>
        
        let child = ['div', 'div','div','div','div', ...];



            ver.1 마지막 자식 선택
            $('#box:last-child').css ({
            backgroundColor : 'tomato',
            });
            
            ver.2
            $('#box').last().css ({
            backgroundColor : 'tomato',
            });
            
            
            ver.3
            $('#box').eq(4).css ({         //eq 배열 안의 (4)(i인덱스)마지막(다섯번째) 자식
            backgroundColor : 'tomato',
            });


        <이동명령>

        선택자1 = 자식, 선택자2 = 부모 
        => appendTo, prependTo 태그에만. 


        1)
        $('선택자1').appendTo('선택자2');
        => 선택자1을 선택자2 안에서 뒤쪽으로 이동시켜라
    ex) $('#con_wrap li').first().appendTo('#con_wrap');    

        2)
        $('선택자1').prependTo('선택자2');
        => 선택자1을 선택자2 안에서 앞쪽으로 이동시켜라
    ex) $('#con_wrap li').last().prependTo('#con_wrap');

        3)
        $('선택자1').insertBefore('선택자2');
        => 선택자1이 선택자2 바로 앞쪽 이동

        $('선택자1').insertAfter('선택자2');
        => 선택자1이 선택자2 바로 뒤쪽 이동



        [ insertBefore, insertAfter에서 선택자2번 중요 ] -> 이 태그는 형제, 부모자식 관계 상관X
        
    ex) <ul id="con_wrap">
            <li>1</li>
            <li id="two">2</li>
            <li class="five">5</li>
        </ul>
        
        => 만약 선택자 1, 2의 관계가 형제관계인 경우
        
        $('#con_wrap').last().insertBefore('#two')

        ->

        <ul id="con_wrap">
            <li>1</li>
            <li class="five">5</li>
            <li id="two">2</li>
        </ul>

        => 만약 선택자 1, 2의 관계가 부모 자식인 경우

        $('#con_wrap').last().insertBefore('#con_wrap');

        <li class="five">5</li>
        <ul id="con_wrap">
            <li>1</li>            
            <li id="two">2</li>
        </ul>
