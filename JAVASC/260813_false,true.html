<!-- 
    직접입력일때 : 프롬포트 사용 **

    <연산자>

    - 산술연산자

    덧셈 : + sum
    뺄셈 : - minus
    곱셈 : * multiple
    나눗셈 : / divide
    나머지 : % remainder (num % 2 === 0 ) 이렇게사용해야댐
    제곱 : ** square


    - 비교연산자 (조건문)

    <
    >
    <=
    >=
    == 같다 / != 같지 않다 (1 == '1') 단순 비교
    === 같다 / !== 같지 않다 (1 === '1') 양쪽의 데이터 타입까지 비교 => 많이 사용 / 자바스크립트가 유연한 언어이기 때문에 엄격하게 코드를 짜야함/

    - 할당연산자 

    += x = x + y => [ x += y ]
    -= x = x - y => [ x -= y ]
    *= x = x * y => [ x *= y ]
    /= x = x / y => [ x /= y ]
    %= x = x % y => [ x %= y ]
    **= x = x ** y => [ x **= y ]

    - 증감연산자 (반복문)

                ++ , --
    1) 전위증감 : ++x --x : 1 씩 증가 or 감소 (앞의 숫자가 뒤의 숫자와 같다.) y=++x / y=--x
    2) 후위증감 : x++ x-- : 1 씩 증가 or 감소 > 더 많이 사용 (앞의 숫자가 뒤의 숫자보다 1 다르다.) y=x++ / y=x--

    - 논리연산자 (조건문, 반복문)
    1) and (&&) : 모든 조건이 true => true
    2) or (||) : 하나라도 조건이 true => true   =>  조건이 둘 다 false false를 반환

    ex)
        if(age >= 12 && h >= 140)

        let num1 = 10;
        let num2 = 30;

        console.log(num1 < num2 && num1 < 20); => true
        console.log(num1 < 20 && num1 < num2); => false

        console.log(num1 < num2 || num1 < 20); => true
        console.log(num1 < 20 || num1 < num2); => true


-->
