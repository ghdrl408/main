<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            * {
                padding: 0;
                margin: 0;
                
            }

            body {
                background-color: lightgray;
            }

            #wrap {
                width: 100%;
                
            }

            form {
                width: 500px;
                margin: 50px auto 100px auto;
            }

            h1{
                width: 100%;
                text-align: center;
                font: 30px / 100px '';

            }

            .txt {
                width: 100%;
                height: 20px;
                font: 20px / 20px '';
                margin: 10px 0;
            }

            input, select {
                width: 100%;
                height: 50px;
                border: 1px solid gray;
                box-sizing: border-box;
                margin-bottom: 30px;
                padding: 10px 20px;
                font-size: 20px;
            }

            .txt span {
                font-size: 16px;
                color: gray;
            }

            #phone {
                width: 300px;
                float: left;

            }

            #btn {
                width: 170px;
                float: right;
                background-color: teal;
                color: white;
                cursor: pointer;
                /* 클릭해야하는 버튼임을 알려주는 속성 */
            }

            #join {
                width: 100%;
                height: 70px;
                font: 20px / 50px '';
                background-color: teal;
                color: white;
                text-align: center;

            }

        </style>
    </head>
    <body>
        <div id="wrap">
            <form action="/">
                <h1>회원가입</h1>
                
                <div class="txt">비밀번호</div>
                <input type="password">
                <div class="txt">비밀번호 확인</div>
                <input type="password">
                <div class="txt">이름</div>
                <input type="text">
                <div class="txt">생년월일</div>
                <input type="date">
                <div class="txt">성별</div>
                <select name="" id="">
                    <option value="성별">성별</option>
                    <option value="남자">남자</option>
                    <option value="여자">여자</option>
                    <option value="선택안함">선택안함</option>
                </select>
                <div class="txt">이메일 <span>(선택)</span></div>
                <input type="email">
                <div class="txt">휴대전화</div>
                <input type="tel" id="phone">
                <input type="button" value="인증번호 받기" id="btn">
                <input type="txt" id="number" placeholder="인증번호를 입력해주세요">
                <input type="submit" value="가입하기" id="join">

            </form>
        </div>
        
    </body>
</html>
