<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>transition</title>
        <style>

            * {
                padding: 0;
                margin: 0;
            }

            .out_box {
                width: 100px;
                height: 100px;
                background-color: lightblue;
                margin: 50px;
                float: left;
                position: relative;
                }

                .box {
                    width: 100px;
                    height: 100px;
                    background-color: darkorange;
                }

                .out_box:hover .size {
                    width: 10px;
                    height: 200px;
                    transition: 1s ;
                }

                .out_box:hover .move {
                    margin: 50px 50px;
                    transition: 1s;
                }

                .out_box:hover .border {
                    border: 10px solid black;
                    box-sizing: border-box;
                }

                .out_box:hover .opacity {
                    opacity: 0;
                    transition: 1s;
                }

                .out_box:hover .color {
                    background-color: darkcyan;
                    transition: 1s;
                }

                .line {
                    position: absolute;
                    background-color: black;
                    width: 0;
                    height: 0;
                    
                }

                .line1 {
                    top: 0;
                    left: 0;
                    height: 5px;
                }

                .line2 {
                    top: 0;
                    right: 0;
                    width: 5px;
                }

                .line3 {
                    right: 0;
                    bottom: 0;
                    height: 5px;
                }

                .line4 {
                    bottom: 0;
                    left: 0;
                    width: 5px;
                }

                .out_box:hover .line1{
                    width: 100%;
                    transition: 0.5s;
                }

                .out_box:hover .line2{
                    height:100%;
                    transition: 0.5s 0.5s;
                }

                .out_box:hover .line3{
                    width: 100%;
                    transition: 0.5s 1s;
                }

                .out_box:hover .line4{
                    height: 100%;
                    transition: 0.5s 1.5s;
                }

                    box-sizing: border-box;

                    position: absolute;

                    background-color: blue;
                    top: 0%;
                     left: 0%;

                    transition: 1s;
                }

                .out_box:hover .line1 {
                    position: absolute;
                    width: 100px;
                    height: 1px;
                    background-color: blue;
                    top: 100%;
                    left: 0%;

                    transition: 1s; 
                }
                 */
                
        </style>
    </head>
    <body>
        <div class="out_box">
            <div class="box size"></div>
        </div>
        <div class="out_box">
            <div class="box move"></div>
        </div>
        <div class="out_box">
            <div class="box border"></div>
        </div>
        <div class="out_box">
            <div class="box opacity"></div>
        </div>
        <div class="out_box">
            <div class="box color"></div>
        </div>
        <div class="out_box">
            <div class="box line line1"></div>
            <div class="box line line2"></div>
            <div class="box line line3"></div>
            <div class="box line line4"></div>
        </div>
    </body>
</html>


<!-- 
    <transition>
    - 속성 변화나 동작 구현 시 사용
    
    1) transition-duration : 동작 지속시간 (동작을 하는데 걸리는 시간)
    2) transition-delay : 동작 지연시간 (동작이 시작하기 전 대기 시간)
    3) transition-property : 속성 (속성 지정시 속성에만 값이 적용 ex)width, height, background-color ...)
        - all(기본값) : 모든 속성에 적용
        - ex) width : 너비만 움직이고 height는 안움직임
    4) transition-timing-function : 가속도 형태 
        - linear : 처음부터 끝까지 속도가 일정
        - ease : (기본값) 천천히 시작 ~ 점점 속도 ~ 천천히 끝 (미세함)
        - ease-in : 속도의 시작을 느리게
        - ease-out : 속도의 끝을 느리게
        - ease-in-out : 느리게 시작하고 느리게 끝
    5) transition : (축약형) 속성 지속시간 가속도 지연시간;
        - 속성값 생략가능 => 시간값만 입력해도 상관없음

    ** display-none / :block => transition-duration 같이 사용할수 없음







-->
