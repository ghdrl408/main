            .box{
                width: 300px;
                height: 300px;
                position: absolute;
                top: 0;
                bottom: 0;
                animation: boxspin 2s infinite alternate ease;
                transform: rotate(0) scale(0);
            }

            #box1 {
                background-color: pink;

            }

            #box2 {
                background-color: rgb(192, 197, 255);
                animation-delay: 0.5s;
            }

            #box3 {
                background-color: rgb(212, 255, 192);
                animation-delay: 1s;
            }
