<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            *{
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }

            #wrap {
                width: 100%;
                
            }

            header {
                width: 100%;
                height: 200px;
                background-color: lightslategray;
                float: left;
            }

            #in_header {
                width: 1200px;
                height: 100%;
                margin: 0 auto;
            }

            #menu_wrap {
                width: 1100px;
                height: 100%;
                background-color: grey;
                float: left;
            }

            #menu_wrap li {
                width: 220px;
                height: 100%;
                float: left;
                border-right: 1px solid white;
                box-sizing: border-box;
                text-align: center;
                font: 25px / 200px '';
            }

            #menu_wrap li:first-child,#logo:nth-child(2) {
                border-right: 0;
            }

            #logo_wrap {
                background-color: beige;
            }

            .logo {
                width: 110px;
                height: 100px;
                margin: 50px 0;
                float: left;
                background-color: blueviolet;
                text-align: center;
                font: 25px / 100px '';
                border-right: 1px solid white;
                box-sizing: border-box;
            }

            .logo:last-child {
                border-right: 0;
                background-color: rgb(162, 93, 226);
            }

            #side_manu {
                width: 100px;
                height: 200px;
                background-color: rgb(112, 88, 53);
                float: right;
                text-align: center;
                font: 20px / 100px '';               
            }

            #side_manu li {
                border-bottom: 1px solid white;
                box-sizing: border-box;
            }
            
            #side_manu li::nth-child(2) {
                
                border-bottom: 0;
            }

            /* header end */



            section {
                width: 100%;
                height: 1000px;
                background-color: rgb(148, 148, 148);
                float: left;
            }

            #container {
                width: 1200px;
                height: 100%;
                margin: 0 auto;

            }

            #left {
                width: 1000px;
                height: 800px;
                margin: 100px auto;
                float: left;
            }

            #left_con {
                width: 500px;
                height: 800px;
                background-color: khaki;
                float: left;
            }

            #right_con {
                width: 400px;
                height: 800px;
                background-color: rgb(209, 203, 146);
                float: right;

            }

            #top_box {
                width: 100%;
                height: 500px;
                background-color: khaki;
                padding: 20px;
                box-sizing: border-box;
            }

            .col {
                width: 106.666px;
                height: 100%;
                background-color: aquamarine;
                float: left;
                text-align: center;
                line-height: 460px;
                font: 15px / 460px '';
            }

            .col:nth-child(2) {
                margin: 0 20px;
                background-color: transparent;
            }

            .center {
                height: 220px;
                line-height: 220px;

            }

            .center:first-child {
                margin-bottom: 20px;
                background-color: aquamarine;
                
            }
            .center:last-child {
                background-color: aquamarine;
                
            }

            #bottom_box {
                width: 100%;
                height: 250px;
                margin-top: 50px;
                float: left;
            }

            #btn {
                width: 200px;
                height: 50px;
                background-color: bisque;
                text-align: center;
                font: 13px / 50px '';
                margin: 150px auto 50px auto;
            }


            #right {
                width: 170px;
                height: 1000px;
                background-color: rgb(82, 82, 82);
                float: right;
            }

            #right div {
                width: 100%;
                height: 200px;
                border-bottom: 1px solid white;
                box-sizing: border-box;
                text-align: center;
                font: 30px / 200px '';
                color: white;
            }

            footer {
                width: 100%;
                height: 100px;
                background-color: bisque;
                float: left;
            }
        </style>
    </head>
    <body>
        

        <div id="wrap">
            <header>
                <div id="in_header">
                    <ul id="menu_wrap">
                        <li id="logo_wrap">
                            <div class="logo">LOGO</div>
                            <div class="logo">Site</div>
                        </li>
                        <li>Menu1</li>
                        <li>Menu2</li>
                        <li>Menu3</li>
                        <li>Menu4</li>
                    </ul>
                    <ul id="side_manu">
                        <li>로그인</li>
                        <li>회원가입</li>
                    </ul>
                </div>
            </header>
            <!-- header end -->

            <section>
                <div id="container">
                    <div id="left">
                        <div id="left_con"></div>
                        <div id="right_con">
                            <div id="top_box">
                                <div class="col">1</div>
                                <div class="col">
                                    <div class="center">2</div>
                                    <div class="center">3</div>
                                </div>
                                <div class="col">4</div>
                            </div>
                            <div id="bottom_box">
                                <div id="btn">butten</div>
                            </div>
                        </div>
                    </div>
                    <div id="right">
                        <div>1</div>
                        <div>2</div>
                        <div>3</div>
                        <div>4</div>
                        <div>5</div>
                    </div>
                </div>
            </section>

            <!-- end -->
            <footer></footer>
        </div>
    </body>


</html>
