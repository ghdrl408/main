<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfbfbf">
  <title>GACHA-PICK 시작</title>
  <link rel="preload" href="../last/Font/GalmuriMono11.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" as="image" href="1st_img/메인_1.png">
  <link rel="stylesheet" href="startPage.css">
  <script src="startPage.js" defer></script>
</head>
<body>
  <main class="start-screen" aria-label="가챠픽 시작 화면">
    <div class="design-canvas" id="design-canvas">
      <img class="screen-frame" id="screen-frame" src="1st_img/메인_1.png" alt="" draggable="false">
      <span class="header-ball-mask" aria-hidden="true"></span>
      <img class="header-pink-ball" src="1st_img/헤더 분홍 공.svg" alt="" aria-hidden="true" draggable="false">
      <div class="art-mask" aria-hidden="true"></div>
      <div class="sequence-art" id="sequence-art" aria-hidden="true"></div>
      <div class="loading-label" id="loading-label" aria-live="polite">roading...</div>
      <button class="start-button" id="start-button" type="button" aria-label="가챠픽 시작" hidden>
        <img src="1st_img/시작버튼.svg" alt="시작!" draggable="false">
      </button>
    </div>
    <p class="screen-reader-only" id="sequence-status" aria-live="polite">가챠픽을 준비하고 있어요.</p>
  </main>
</body>
</html>
