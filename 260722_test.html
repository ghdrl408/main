<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{
                padding: 0;
                margin: 0;
                background-color: skyblue;

            }

            #wrap {
                width: 1000px;
                height: 200px;
                border: 4px solid white;
                margin: 300px auto;
                background-color: rgb(192, 197, 201);
                position: relative;
            }

            .box {
                width: 200px;
                height: 200px;
                background-color: rgb(255, 0, 43);
                box-sizing: border-box;
                position: absolute;
                top: 0;
                left: 0;
                font: 50px / 200px '';
                text-align: center;
            }

            #mov1{
                background-color: rgb(255, 115, 0);
            }
            #mov2{
                background-color: rgb(251, 255, 0);
            }
            #mov3{
                background-color: rgb(17, 255, 0);
            }
            #mov4{
                background-color: rgb(0, 51, 255);
            }

            #wrap:hover #mov1{
                left: 200px;
                transition: 0.5s 0.6s;
            }
            #wrap:hover #mov2{
                left: 400px;
                transition: 0.5s 0.4s;
            }
            #wrap:hover #mov3{
                left: 600px;
                transition: 0.5s 0.2s;
            }
            #wrap:hover #mov4{
                left: 800px;
                transition: 0.5s ;
            }


        






        </style>
    </head>
    <body>
        <div id="wrap">
            <div class="box">뿅</div>
            <div class="box mov" id="mov1">뺭</div>
            <div class="box mov" id="mov2">삥</div>
            <div class="box mov" id="mov3">뿡</div>
            <div class="box mov" id="mov4"></div>

        </div>
    </body>
</html>
