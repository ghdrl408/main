<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            margin: 0;
            padding: 0;
        }

        ul, li {
            list-style: none;
        }

        #wrap {
            width:36.45vw;
            height: 400px;
            margin: 0 auto;
            background-color: burlywood;
            border: 10px solid black;
            font-size: 30px;
            text-align: center;
            
        }

        #btn_wrap {
            width: 30%;
            height: 100%;
            float: left;
            background-color: antiquewhite;
            position: relative;

        }

        .btn {
            width: 100%;
            height: 100px;
            line-height: 100px;
            
            cursor: pointer;
        }

        #con_wrap {
            width: 70%;
            height: 100%;
            float: right;
            
            overflow: hidden;
            top: 0;
            left: 0;
            transition: 0.5s;


        }
        .con {
            line-height: 400px;
        }

        .c1, .b1 {
            background-color: aqua;
        }

        .c2  {
            background-color: navajowhite;
        }

        .c3 {
            background-color: palevioletred;
        }

        .c4 {
            background-color: indianred;
        }
        
        .b2:checked~.c1 {
            font-display: none;

        }








    </style>
</head>
<body>
    
    <div id="wrap">
        <div id="btn_wrap">
            <div class="btn b1">1</div>
            <div class="btn b2">2</div>
            <div class="btn b3">3</div>
            <div class="btn b4">4</div>
        </div>
        <div id="con_wrap">
            <div class="con c1">첫번째</div>
            <div class="con c2">두번째</div>
            <div class="con c3">세번째</div>
            <div class="con c4">네번째</div>
        </div>
    </div>
</body>
</html>
