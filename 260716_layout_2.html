<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            ul, li {
                list-style: none;
            }

            a {
                text-decoration: none;
                color: black;
            }

            #wrap {
                width: 100%;
            }

            header {
                width: 100%;
                height: 100px;
                float: left;
            }

            #in_header {
                width: 1200px;
                height: 100%;
                background-color: darkgray;
                text-align: center;
                margin: 0 auto;
            }

            #logo {
                width: 200px;
                height: 100%;
                background-color: green;
                float: left;
                font: bold 30px / 100px '';
                
            }

            #menu_wrap {
                width: 800px;
                height: 100%;
                background-color: darkorange;
                float: right;
            }

            #menu_wrap li {
                width: 20%;
                height: 100%;
                float: left;
                border-right: 1px solid white;
                box-sizing: border-box;
            }

            #menu_wrap li a {
                text-align: center;
                line-height: 100px;
                display: block;
            }


            #sec1 {
                width: 100%;
                height: 400px;
                background-color: bisque;
                float: left;
            }

            #sec2 {
                float: left;
                width: 100%;
            }

            .container {
                width: 1200px;
                margin: 0 auto;
            }

            .circle {
                width: 262.5px;
                height: 262.5px;
                border-radius: 50%;
                background-color: darkolivegreen;
                float: left;
                margin: 50px 50px 50px 0;
            }

            .circle:last-child {
                margin-right: 0;
            }

            #sec3 {
                width: 100%;
                height: 1800px;
                float: left;
                background-color: rgb(192, 200, 209);
            }

            .con_wrap {
                width: 386.666px;
                float: left;

            }

            .con_wrap:nth-child(2) {
                margin: 0px 20px;
            }

            .short {
                width: 100%;
                height: 500px;
                background-color: aliceblue;

            }

            .long {
                width: 100%;
                height: 600px;
                background-color: antiquewhite;
            }

            .margin {
                margin: 50px 0;
            }

            #top_btn {
                width: 50px;
                height: 50px;
                background-color: blue;
                text-align: center;
                line-height: 50px;
                position: fixed;
                right: 50px;
                bottom: 50px;
            }

            footer {
                width: 100%;
                height: 200px;
                background-color: blueviolet;
                float: left;
            }


        </style>
    </head>
    <body>
        <div id="wrap">
            <header>
                <div id="in_header">
                    <div id="logo"><a href="#">LOGO</a></div>
                    <ul id="menu_wrap">
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                    </ul>
                </div>
            </header>
            <!-- header end -->
            <section id="sec1"></section>
            <!-- section1 end -->
            <section id="sec2">
                <div class="container">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </section>
            <!-- section2 end -->
            <section id="sec3">
                <div class="container">
                    <div class="con_wrap">
                        <div class="short"></div>
                        <div class="long margin"></div>
                        <div class="short"></div>
                    </div>
                    <div class="con_wrap">
                        <div class="short"></div>
                        <div class="short margin"></div>
                        <div class="long"></div>
                    </div>
                    <div class="con_wrap">
                        <div class="short"></div>
                        <div class="long margin"></div>
                        <div class="short"></div>
                    </div>
                </div>
            </section>
            <!-- section3 end -->
            <div id="top_btn">
                <a href="#">TOP</a>
            </div>
            <!-- btn end -->
            <footer></footer>
            <!-- footer end -->
        </div>
    </body>

</html>
