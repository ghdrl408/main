<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>flex</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }

            body {
                display: flex;
            }
            .container {
                display: flex ;
                width: 500px;
                height: 500px;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                background-color: lightblue;

            }

            .items {
                width: 100px;
                height: 100px;
                background-color: rgb(110, 114, 240);
                border: 5px solid blueviolet;
                box-sizing: border-box;
                font-size: 40px;

            }



            



        </style>
    </head>
    <body>
        <div class="container">
            <div class="items">1</div>
            <div class="items">2</div>
            <div class="items">3</div>
        </div>
        <div class="container">
            <div class="items">4</div>
            <div class="items">5</div>
            <div class="items">6</div>
        </div>
    </body>
</html>
