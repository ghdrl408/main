<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
        #wrap1{
            width: 400px;
            height: 400px;
            border: 10px solid black;
            margin: 100px auto;
        }

        #menu {
            display: none;
        }

        #menu_label {
            display: block;
            width: 100%;
            height: 50px;
            background-color: blueviolet;
            text-align: center;
            line-height: 50px;
        }

        #show_box {
            width: 100%;
            height: 0;
            background-color: aquamarine;
            text-align: center;
            line-height: 325px;
            overflow: hidden;
            transition: 0.5s
        }

        /* #menu:checked : 메뉴id가 체크가 되었을때의 태그 */
      #menu:checked ~ #show_box {
            height: 350px;
       }



        li, ul {
            list-style: none;
            
        }


        * {
            padding: 0;
            margin: 0;
        }

        a {
            text-decoration: none;
            color: black;
        }
        #wrap2 {
            width: 1000px;
            height: 100px;
            margin: 0 auto;
            border: 10px solid black;


        }

        .menu {
            width: 250px;
            height: 100px;
            background-color: lightcoral;
            float: left;
            text-align: center;
            font: 22px / 100px '';
            transition: 0.5s;

        }

        .menu:hover {
            background-color: rgb(230, 50, 110);
            
        }
        .sub {
            width: 250px;
            height: 0;
            overflow: hidden;
            background-color: rgb(137, 237, 237);
            border-bottom: 1px solid black;
            transition: 0.5s;
        }

        .sub li {
            border-bottom: 1px solid rgb(148, 148, 148);
            box-sizing: border-box;

        }
        .menu:hover .sub {
           height: 300px;
        }




    </style>
    <body>
        <div id="wrap1">
            <input type="checkbox" id="menu">
            <label for="menu" id="menu_label" >&#9660;</label>
            <div id="show_box">
                <h1>위에서 움직임</h1>
            </div>
        </div>

        <div id="wrap2">
            <div class="menu">
                <h2><a href="#">menu</a></h2>
                <ul class="sub">
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                </ul>
            </div>
            <div class="menu">
                <h2><a href="#">menu</a></h2>
                <ul class="sub">
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                </ul>
            </div>
            <div class="menu">
                <h2><a href="#">menu</a></h2>
                <ul class="sub">
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                </ul>
            </div>
            <div class="menu">
                <h2><a href="#">menu</a></h2>
                <ul class="sub">
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                    <li><a href="#">sub</a></li>
                </ul>
            </div>
        </div>
    </body>
</html>
