<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            *{
                padding: 0;
                margin: 0;
            }

            a {
                text-decoration: none;
                color: black;
            }

            ul, li {
                list-style: none;
            }

            

            #wrap {
                width: 100%;
            }

            header, section, footer {
                width: 100%;
            }


            #in_header, #container {
                width: 1200px;
                height: 100%;
                background-color: rgb(128, 209, 209);
            }

            header {
                height: 100px;
                background-color: lightcoral;
                display: flex;
                justify-content: center;

            }

            #in_header {
                display: flex;
                justify-content: space-between;
            }

            #logo {
                width: 150px;
                height: 100%;
                background-color: tomato;
                display: flex;
                justify-content: center ;
                align-items: center;
            }

            #menu_wrap {
                width: 800px;
                height: 100%;
                background-color: aquamarine;
                display: flex;
                justify-content: center ;
                align-items: center;
            }

            #menu_wrap li {
                width: 200px;
                height: 100%;
                display: flex;
                justify-content: center ;
                align-items: center;

            }

            #sec1 {
                background-color: aqua;
                height: 700px;
            }

            #sec2 {
                height: 500px;
                background-color: cornflowerblue;
                margin: 100px auto;
                display: flex;
                justify-content: center;
            } 

            #container {
                display: flex;
                justify-content: space-between;
            }

            .con {
                width: 380px;
                height: 100%;
                background-color: darksalmon;
            }

            footer {
                height: 100px;
                background-color: yellowgreen;
            }





        </style>
    </head>
    <body>
        <div id="wrap">
            <header>
            <div id="in_header">
                <div id="logo"><a href="#"></a>logo</div>
                    <ul id="menu_wrap">
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                        <li><a href="#">menu</a></li>
                    </ul>
                </div>
            </header>
            <section id="sec1"></section>
            <section id="sec2">
                <div id="container">
                    <div class="con"></div>
                    <div class="con"></div>
                    <div class="con"></div>
                </div>
            </section>
            <footer></footer>
    </body>
</html>
