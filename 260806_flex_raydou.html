<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>rayout</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            a {
                text-decoration: none;
                color: black;
            }

            ul, li {
                list-style: none;
            }

            #container {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;

            }

            header {
                width: 100%;
                height: 80px ;
                background-color: lightgrey;
                display: flex;
                justify-content: center;
                margin-bottom: 30px;

            }

            #in_header {
                width: 1200px;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
            


            }

            #logo {
                display: flex;
                width: 150px;
                height: 50px;
                background-color: rgb(177, 177, 177);
                justify-content: center;
                align-items: center;
                font-size: 20px;
            }

            #menu_wrap {
                display: flex;
                width: 500px;
                height: 100%;
                justify-content: flex-end;
                align-items: center;
            }

            #menu_wrap li {
                width: 100px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: gray;
                font-size: 20px;
            }


            /* header end */


            #sec1 {
                width: 100%;
                height: 300px;
                background-color: lightblue;
                margin-bottom: 30px;
                display: flex;
                justify-content: center;


            }

            #sec1_container {
                width: 1200px;
                height: 300px;
                display: flex;
                justify-content: center;
                background-color: aquamarine;
                
            }
 

           

            #sec2 {
                width: 100%;
                height: 230px;
                background-color: lightblue;
                margin-bottom: 30px;
                display: flex;
                justify-content: center;

            }

            #sec2_container {
                width: 1200px;
                height: 230px;
                display: flex;
                justify-content: center;


            }

            #big_container {
                width: 1200px;
                height: 100px;
                display: flex;
                justify-content: space-between;
                margin-bottom: 30px;

            }

            .big_item {
                width: calc((100% - 30px)/3);
                height: 100%;
                background-color: aqua;
                display: flex;
                justify-content: space-between;

            }

            #small_container {
                width: 1200px;
                height: 100px;
                display: flex;
                justify-content: space-between;
            }

            .small_item {
                width: calc((100% - 75px)/6);
                height: 100%;
                background-color: aqua;
                display: flex;
                justify-content: space-between;

            } 

            footer {
                width: 100%;
                height: 80px;
                background-color: blue;
            }







        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <div id="in_header">
                    <div id="logo"><a href="#">LOGO</a></div>
                    <ul id="menu_wrap"><a href="#">
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                    </a></ul>
                </div>
            </header>

            <section id="sec1">
                <div id="sec1_container"></div>                </div>
            </section>

            <section id="sec2">
                <div sec2_container>
                    <div id="big_container">
                        <div class="big_item"></div>
                        <div class="big_item"></div>
                        <div class="big_item"></div>
                    </div>
                    <div id="small_container">
                        <div class="small_item"></div>
                        <div class="small_item"></div>
                        <div class="small_item"></div>
                        <div class="small_item"></div>
                        <div class="small_item"></div>
                        <div class="small_item"></div>
                    </div>
                </div>
                
            </section>

            <footer></footer>
        </div>
    </body>
</html>
