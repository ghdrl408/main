<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            a {
                text-decoration: none;
                color: black;
            }

            ul, li {
                list-style: none;
            }

            header, section, footer {
                width: 100%;
                background-color: lightgrey;
            }
            
            header {
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #in_header {
                width: 1200px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            #logo {
                width: 150px;
                height: 50px;
                background-color: aquamarine;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #menu_wrap {
                display: flex;
                align-items: center;

            }

            .menu {
                width: 100px;
                height: 50px;
                background-color: rgb(56, 142, 113);
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .menu a {
                color: white;
            }

            #sec1 {
                height: 300px;
                background-color: lightslategray;
                display: flex;
                justify-content: center;
                margin-top: 30px;

            }

            #sec1_con {
                width: 1200px;
                height: 100%;
                background-color: lightskyblue;
            }

            #sec2 {
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color:aquamarine;
                margin-top: 30px;
            }

            .container {
                width: 1200px;
                height: 100px;
                background-color: lightcoral;
                display: flex;
                justify-content: space-between;
            }

            .box {
                width: 100%;
                height: 100%;
                background-color: antiquewhite;
            }

            .container:nth-child(1) .box{
                width: calc((100% - 30px) / 3);
            }

            .container:nth-child(2) {
                margin-top: 15px;
            }

            .container:nth-child(2) .box {
                width: calc((100% - 75px) /6 );
            }

            footer {
                margin-top: 30px;
                height: 80px;
                background-color: black;
            }



        </style>
    </head>
    <body>
        <header>
            <div id="in_header">
                <div id="logo"><a href="#">LOGO</a></div>
                <ul id="menu_wrap">
                    <li class="menu"><a href="#">menu</a></li>
                    <li class="menu"><a href="#">menu</a></li>
                    <li class="menu"><a href="#">menu</a></li>
                    <li class="menu"><a href="#">menu</a></li>
                    <li class="menu"><a href="#">menu</a></li>

                </ul>
            </div>
        </header>

        <section id="sec1">
            <div id="sec1_con"></div>
        </section>
        <section id="sec2">
            <div class="container">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="container">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </section>
        <footer id="footer"></footer>
    </body>
</html>
