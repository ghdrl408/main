<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background, 여백</title>
    <style>
        body {
            height: 4000px;
        }

        #cil {
            width: 200px;
            height: 400px;
            background-image: radial-gradient(ellipse at 50%, gold, darkgreen);
        }

        #linear {
            width: 300px;
            height: 300px;
            background-image: linear-gradient(90deg, gold 0 10px, darkgreen 10px 50px, yellowgreen 50px 300px);
        }



        #cra {
            width: 300px;
            height: 70px;
            background-image: linear-gradient(to bottom, red 0 10px, orange 10px 20px, yellow 20px 30px, green 30px 40px,
                    blue 40px 50px, navy 50px 60px, purple 60px 70px);
        }


        #lra {
            width: 300px;
            height: 70px;
            background-image: linear-gradient(to right, red, orange, yellow, green, blue, rgb(11, 0, 110), purple);
        }

        #box1 {
            width: 1600px;
            height: 600px;
            border: 10px solid darkred;
            background-image: url(./cap0.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        .box {
            width: 300px;
            height: 300px;
            font-size: 20px;
            background-color: aquamarine;
        }

        #margin_box {
            margin: 20px 30px 40px 50px;
            /* margin: 50px auto; */
        }

        #padding_box {
            padding: 100px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <!-- <div id="cil"></div> -->
    <div id="linear"></div>
    <div id="cra"></div>
    <br>
    <div id="lra"></div>

    <br>
    <div id="box1"></div>

    <div class="box" id="margin_box">margin</div>

    <div class="box" id="padding_box">padding</div>

    <div id="box5"></div>


</body>

</html>



<!-- 
    <background>
    1) background-color : 배경색상; > 색상명, 16진수(#000000), rgb(red, green, blue), rgba(red, green, blue, alpha(0~1사이))

    2) background-image : url(링크, 상대경로);
      > 배경이미지
      > 기본적으로 반복
      > img태그와 차이점은 ing태그는 이미지 자체를 불러오고, 배경이미지 객체 안쪽으로 이미지를 삽입 > 클리핑마스크와 유사
      > url 경로, a태그에서는 href, img태그에서는 src
      > 그라디언트
        - linear-gradient : 선형그라디언트 ex)back-ground(방향 또는 각도, 컬러1, 컬러2, ...)
            - 방향 : to top /to right /to bottom /to left
            - 각도 : 숫자deg
            - 컬러 비율 - 절대px, 상대%

        - radial-gradient : 방사형그라디언트 ex)radial-ground(모양, 컬러1, 컬러2, ...)
            - 모양 : circle, ellipse
            - 중심 : at 위치 (50% = 중앙)
        - repeating : 반복

    3) background-repeat : 반복 제어하는 속성
      > repeat : 반복 (기본값)
      >no-repeat : 반복X
      >repeat-x : 가로반복
      >repeat-y : 세로반복

    4) background-size : 배경이미지 크기 설정 속성
      ex) background-size : 100%; > 하나만 작성시 가로값 설정(세로는 가로값 자동비율 조정)
        > 두 값을 다 작성했을때는 순서대로 가로값 세로값
        > 띄워쓰기로 구분
        > px, % 단위
        [contain] : 박스크기에 이미지를 가득 채워주는데 빈 부분이 존재할 수 있음 (사이즈미스시)
        [cover] : 박스크기에 이미지 비율을 유지한채로 가득 채워줌 (넘치면 이미지가 잘려서 빈 부분이 존재하지 않음) > 이미지 원본 크기에 따라 보여지는게 달라짐

    5) background-position : 위치 설정값
      > left, right, center / top, bottom, center, 수치값 가능 (px)
      ex) background-position : center center;
      >두 개의 값을 다 적게 되면 순서대로 가로값 세로값
      >구분은 띄워쓰기로
    6) background-attachment : 배경이미지 고정
    - scroll : 스크롤시 이미지가 움직임 (기본값)
    - fixed : 스크롤시 이미지 고정
    스크롤 길게 만들기 : <style> body {height 많이px}

    7) background : 축약형 (띄어쓰기로 구분)
    - color image repeat position/size
    ex) background : blue url() no-repeat canter / cover




    <여백 관련 속성>
    1) margin 
      -박스 '바깥' 기준 여백, 4가지 방향
        >원하는 방향으로 간격 지정해서 설정

        ex) nargin : 50px 150px 100px 20px; (상단부터 시계방향 순서. 상우하좌)
            margin : 50px; (상하 좌우 값이 동일한 경우) 
            margin : 100px; (모든 방향이 같은 간격)
            margin : 상하여백 auto; (객체를 브라우저 정중앙 배치) *자주쓰임

            margin-top : 수치px;
            margin-bottom
            margin-left
            margin-right        >특정 부위에만 여백 주고 싶을 때


    2) padding 
    - 박스 '안쪽' 기준 여백, 4가지 방향
      > 원하는 방향으로 간격 지정해서 설정

      ex) padding : 50px 150px 300px 20px; 상 우 하 좌
          padding : 50px 50px; 상하 좌우
          padding : 100px; 모든 간격이 같은 간격

        padding-left
        padding-light
        padding-top
        padding-bottom           >특정 부위에만 여백 주고 싶을 때


    <padding + border>
    - 우리가 설정한 박스의 크기
    width, hight

    -브라우저가 인식하는 박스의 크기
    width : 내가 지정한 크기 + padding + border
    hight : 내가 지정한 크기 + padding + border

    box-sizing : 내가 지정한 크기에 padding, border의 크기를 포함시킬 때 사용 *중요

    width : 400px;
    border : 10px solid black;
    padding : 50px;

    [ box-sizing : border-box ]
    
    
    <reset css>
    브라우저가 기본적으로 자동으로 가지고 있는 여백값이 존재
    여백값들을 초기화하기 위한 속성

    * {
       padding: 0;
       margin: 0;    
    }

       > * 은 전체 선택자
       > body 내에 있는 모든 요소를 선택
       > 단, 우선순위 최하 




        
-->
