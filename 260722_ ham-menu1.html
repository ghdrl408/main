<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>움직이는 메뉴 버튼</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }

            a {
                text-decoration: none;
                color: black;
            }

            #wrap {
                width: 600px;
                height: 600px;
                margin: 50px auto;
                border: 10px solid dimgray;
                position: relative;
            }

            header{
                position: relative;
                width: 100%;
                height: 100px;
                background-color: palevioletred;
            }

            #ham {
                display: none;

            }

            #ham, #ham_label {
                width: 60px;
                height: 50px;
                position: absolute;
                top: 25px;
                right: 30px;
                cursor: pointer;
            }

            .line {
                width: 60px;
                height: 4px;
                margin-bottom: 19px;
                background-color: aliceblue;
                transition: 0.5s;
            }

            #con {
                width: 100%;
                height: 500px;
                background-color: rgb(255, 243, 243);
                text-align: center;
                font: 50px / 500px '';

            }

            #menu {
                width: 120px;
                height: 0;
                overflow: hidden;
                background-color: rgb(216, 153, 216);
                position: absolute;
                top: 100px;
                right: 0;
                transition: 0.5s;
            }

            #menu li {
                width: 100%;
                height: 50px;
                border-bottom: 1px solid white;
                box-sizing: border-box;
                text-align: center;
                font: 20px / 50px '';
            }

            #ham:checked~#menu {
                height: 150px;

            }

            #ham:checked~#ham_label #top {
                transform: translateY(23px) rotate(45deg);
                transform-origin: center;
            }

            #ham:checked~#ham_label #middle {
                opacity: 0;
            }

            #ham:checked~#ham_label #bottom {
                transform: translateY(-23px) rotate(-45deg);
                transform-origin: center;
                /* top이랑 반대로 가는거니까 축 마이너스- 달아주면 됨 */
            }








        </style>
    </head>
    <body>
        <div id="wrap">
        <header>
            <input type="checkbox" id="ham">
            <label for="ham" id="ham_label">
                <div class="line" id="top"></div>
                <div class="line" id="middle"></div>
                <div class="line" id="bottom"></div>
            </label>
            <ul id="menu" >
                <li ><a href="#">LIST</a></li>
                <li ><a href="#">LIST</a></li>
                <li ><a href="#">LIST</a></li>
            </ul>
        </header>
        <div id="con">
            움직이는 메뉴 버튼
        </div>
        </div>
    </body>
</html>
