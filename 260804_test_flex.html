        <title>flex_test</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            body {
                display: flex;
                justify-content: center;
            }
            a {
                text-decoration: none;
                color: black;
            }

            ul, li {
                list-style: none;
            }

            body {
                display: flex;
                justify-content: center;
            }

            .container {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
            }

            header {
                width: 100%;
                height: 100px;
                background-color: lightgrey;
                display: flex;
                justify-content: center;
            }

            #in_header {
                width: 1200px;
                height: 100%;
                background-color: lightblue;
                display: flex;
                flex-direction: row;
                font-size: 20px;
            }

            #logo {
                width: 200px;
                height: 100%;
                background-color: tomato;
                justify-content: center;
                align-items: center;
                display: flex;
            }

            #menu_wrap {
                width: 800px;
                height: 100%;
                display: flex;
                justify-content: flex-end;
            }

            #menu_wrap li {
                background-color: aquamarine;
                width: 200px;
                height: 100%;
                display: flex;
                border-right: 1px solid white;
                align-items: center;
                justify-content: center;
            }

                /* header end */

            #sec1 {
                width: 100%;
                height: 700px;
                background-color: lightcoral;
                margin-bottom: 100px;
                display: flex;

            }

            #sec2 {
                width: 100%;
                height: 500px;
                background-color: lightcyan;
                display: flex;
                justify-content: center;
                margin-bottom: 100px;

            }

            .item {
                width: 380px;
                height: 500px;
                background-color: lightgreen;
                display: flex;
                justify-content: space-between;

            }

            footer {
                width: 100%;
                height: 200px;
                background-color: blueviolet;
            }
