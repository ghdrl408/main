<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>grid template areas</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            .container {
                width: 800px;
                height: 800px;
                display: grid;
                grid-template-columns: repeat(3, 1fr) ;
                grid-template-rows: 1fr 1fr 1fr ;
                grid-gap: 10px;
                margin: 50px auto;
                text-align: center;
                font: 30px / 260px '';
                grid-template-areas: "box1 box1 box2"
                                    "box3 box5 box2"
                                    "box3 box4 box4";

            }

            #box1 {
                background-color: teal;
                grid-area: box1;
            }

            #box2{
                background-color: lawngreen;
                grid-area: box2;
                
            }

            
            #box3{
                background-color: rgb(0, 121, 187);
                grid-area: box3;


            }

            
            #box4{
                background-color: rgb(210, 32, 154);
                grid-area: box4;

            }

            
            #box5{
                background-color: rgb(239, 198, 92);
                grid-area: box5;
            }

            .container_f {
                display: flex ;
                flex-direction: row;
                justify-content: center;
                align-items: center;

            }

            .items_f {
                width: 100px;
                height: 150px;
                margin: 55px auto;
                line-height: 150px;
                color: tomato;
                background-color: rgb(255, 255, 255);
                border: 5px solid rgb(203, 116, 1);
                box-sizing: border-box;

            }

            .items_f:nth-child(2) {
                width: 230px;
                margin: 0 10px;
            }

        </style>

    </head>
    <body>
        <div class="container">
            <div class="items" id="box1">1
            </div>
            <div class="items" id="box2">2</div>
            <div class="items" id="box3">3</div>
            <div class="items" id="box4">4</div>
            <div class="items" id="box5">5</div>
        </div>
    </body>
</html>
