<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sementic(시멘틱 태그)</title>
        <style>

            *{
                padding: 0;
                margin: 0;
            }

            #wrap {
                width: 1200px;
                height: 800px;
                background-color: antiquewhite;
                margin: 0 auto;
                text-align: center;
                font-size: 30px;
                color: white;
            }

            header {
                width: 100%;
                height: 100px;
                float: left;
                background-color: grey;
                line-height: 100px;
            }

            #logo {
                width: 200px;
                height: 100%;
                background-color: blue;
                float: left;
            }

            nav {
                width: 800px;
                height: 100%;
                background-color: rgb(255, 196, 33);
                float: right;
            }

            main {
                width: 1200px;
                height: 500px;
                background-color: darkgrey;
                margin: 50px 0;
                float: left;
                line-height: 500px;
            }

            #content {
                width: 1000px;
                height: 500px;
                background-color: rgb(14, 151, 105);
                float: left;
            }

            aside {
                width: 150px;
                height: 100%;
                background-color: blueviolet;
                float: right;
            }

            footer {
                width: 100%;
                height: 100px;
                background-color: deeppink;
                line-height: 100px;
                float: left;
            }

        </style>
    </head>
    <body>
        <div id="wrap">
            
                <header>
                    <div id="logo">로고</div>
                    <nav>MENU</nav>
                </header>
                
                <main>
                    <section id="content">섹션영역</section>
                    <aside>사이드</aside>
                </main>
                <footer> copyright&copy; all rights reserved.</footer>
                
        </div>
    </body>
</html>



<!-- 

    <시멘틱태그>
    html5에서 새로 추가된 태그
    의미가 부여된 태그 -> 직관적으로 기능 파악이 가능한 태그
        -> div, span와 기능이 같지만 기능에 맞게 사용시 관계 파악 쉬움
        -> 브라우저 별로 버전에 따라서 시멘틱태그 지원 여부가 결정되므로 용도에 맞게 사용
        
        header -> 문서 상단 부분 태그
        nav -> 문서 네비게이션(메뉴) 태그
        figure -> 문서의 멀티미디어 요소를 나타내는 태그
            figcaption과함께 사용 (figure가 삭제되어도 영향을 주지 않음)
        section -> 특정 컨텐츠들을 그룹화 시켜주는 태그
        article -> 작은 단위의 콘텐츠 나타내는 태그
        footer -> 문서 하단부분 (카피라이트 영역) 태그
        aside -> 문서의 사이드 컨텐츠 태그

        <header>
        <section> <main>
        <footer>   



-->
