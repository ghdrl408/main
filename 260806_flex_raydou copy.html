<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>rayout</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            a {
                text-decoration: none;
                color: black;
            }

            ul, li {
                list-style: none;
            }

            #container {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;

            }

            header {
                width: 100%;
                height: 80px ;
                background-color: lightgrey;
                display: flex;
                justify-content: center;
                margin-bottom: 30px;

            }

            #in_header {
                width: 1200px;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
            


            }

            #logo {
                display: flex;
                width: 150px;
                height: 50px;
                background-color: rgb(177, 177, 177);
                justify-content: center;
                align-items: center;
                font-size: 20px;
            }

            #menu_wrap {
                display: flex;
                width: 500px;
                height: 100%;
                justify-content: flex-end;
                align-items: center;
            }

            #menu_wrap li {
                width: 100px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: gray;
                font-size: 20px;
            }


            /* header end */

            #grid_wrap {
                width: 100%;
                height: 100%;

            }

            #cintainer {
                width: 1200px;
                height: 560px;
            }



        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <div id="in_header">
                    <div id="logo"><a href="#">LOGO</a></div>
                    <ul id="menu_wrap"><a href="#">
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                        <li><a href="#">manu</a></li>
                    </a></ul>
                </div>
            </header>

            <div id="grid_wrap">
                
                <section id="sec">
                    <div id="container">
                        <div class="top_item"></div>
                        <div class="mid_item"></div>
                        <div class="mid_item"></div>
                        <div class="mid_item"></div>
                        <div class="bottom_item"></div>
                        <div class="bottom_item"></div>
                        <div class="bottom_item"></div>
                        <div class="bottom_item"></div>
                        <div class="bottom_item"></div>
                        <div class="bottom_item"></div>
                    </div>
                </section>
            </div>
            

            <footer></footer>
        </div>
    </body>
</html>
