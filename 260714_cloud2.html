<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            * {
            margin: 0;
            padding: 0;
            }
            
            #out-box {
            width: 800px;
            height: 600px;
            border: 30px solid brown;
            background-color: rgb(100, 183, 250);
            margin: 500px auto;
            margin-top: 150px;
            position: relative;
            }
            
            #o1 {
            width: 200px;
            height: 200px;
            background-color: aqua;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 80%;
            margin-top: -100px;
            margin-left: -150px;
            
            }
            
            #o2 {
            width: 300px;
            height: 300px;
            background-color: aquamarine;
            z-index: +20;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -150px;
            margin-left: -150px;
            }
            
            #o3 {
            width: 200px;
            height: 200px;
            background-color: rgb(235, 242, 255);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 30%;
            margin-top: -100px;
            margin-left: -150px;
            
            }

        </style>
    </head>
    <body>
        <div id="out-box">
            <div class="o">
                <div id="o1"></div>
                <div id="o2"></div>
                <div id="o3"></div>
            </div>
        </div>
</body>
</html>
