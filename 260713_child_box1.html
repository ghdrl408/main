<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ul li:first-child {
            font-style: bold;
        } */
        * {
            padding: 0%;
            margin: 0%;
        }

      

        ul,
        li {
            list-style: none;
        }

        ul {
            width: 500px;
            height: 500px;
            border: 10px solid black;
            margin: 0 auto;
        }

        li {
            width: 500px;
            height: 100px;
            font: 30px / 100px '';
            text-align: center;

        }

        ul li:first-child {
            background-color: yellow;
            font-size: 50px;
        }

        ul li:nth-child(2n) {
            background-color: black;
            color: white;
        }

        ul li:nth-child(3) {
            background-color: green;
            color: red;
        }

        #box {
            width: 200px;
            height: 100px;
            border: 10px solid yellow;
            box-sizing: border-box;
            margin: 0 auto;

        }
    </style>

</head>

<body>

    <ul>
        <li>노랑박스</li>
        <li>블랙박스</li>
        <li>초록박스</li>
        <li>블랙박스</li>
        <li>
            <div id="box"></div>
        </li>
    </ul>

</body>

</html>
