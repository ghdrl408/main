<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            img {
                display: block;
                border: 0;
            }
            
            a {
                text-decoration: none;
                display: block;
            }

            #wrap {
                width: 600px;
                height: 300px;
                border: 10px solid black;
                margin: 100px auto;
            }

            .con {
                width: 200px;
                height: 200px;
                float: left;
            }

            .con img {
                width: 200px;
                height: 200px;
            }

            .con a {
                width: 200px;
                height: 100px;
            }

            .con:first-child a {
                background-color: rgb(224, 219, 219);
            }

            .con:nth-child(2) a {
                background-color: rgb(82, 82, 82);
            }

            .con:nth-child(3) a {
                background-color: rgb(235, 233, 185);
            }

            p{
                text-align: center;
            }


        </style>

    </head>
    <body>


        <div id="wrap">
            <div class="con">
                <img src="./img/dog.jpg" alt="강아지">
                <a href="https://www.bing.com/search?q=%EA%B0%95%EC%95%84%EC%A7%80&cvid=d5900e698ac947689842843b7289e0d0&gs_lcrp=EgRlZGdlKgYIABBFGDkyBggAEEUYOTIGCAEQABhAMgYIAhAAGEAyBggDEAAYQDIGCAQQLhhAMgYIBRAAGEAyBggGEAAYQDIGCAcQABhAMgYICBAAGEDSAQgyMTAzajBqNKgCCLACAQ&FORM=ANAB01&PC=EDGEDB"></a>
            </div>

            <div class="con">
                <img src="./img/pan.jpg" alt="판다">
                <a href="https://www.bing.com/search?q=%ED%8C%90%EB%8B%A4&qs=n&form=QBRE&sp=-1&lq=0&pq=%ED%8C%90%EB%8B%A4&sc=11-2&sk=&cvid=60AE5264B1C04948B438C98F6A69B065"></a>
            </div>
            
            <div class="con">
                <img src="./img/ki.jpg" alt="기린">
                <a href="https://www.bing.com/search?q=%ea%b8%b0%eb%a6%b0&FORM=HDRSC1"></a>
            </div>
           
        </div>

        <p>동물 컬러 버튼을 클릭</p>
        
    </body>
</html>
