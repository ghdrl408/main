<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            ul, li {
                list-style: none;
            }

            a {
                text-decoration: none;
                color: white;
            }

            #wrap {
                width: 100%;
            }

            header {
                width: 100%;
                height: 100px;
                float: left;
                
            }

            #in_header {
                width: 1200px;
                height: 100px;
                background-color: rgb(179, 179, 179);
                font: 30px / 100px '';
                color: white;
                margin: 0 auto;
                

            }

            #menu_wrap {
                width: 1200px;
                height: 100%;
                float: left;
                text-align: center;
            }

            #logo {
                width: 200px;
                height: 100%;
                background-color: rgb(105, 98, 98);
                font-size: 40px;
                float: left;
            }

            .menu {
                width: 160px;
                height: 100%;
                background-color: cornflowerblue;
                float: right;
            }

            /* header end */

            section {
                width: 1200px;
                height: 100%;
                margin: 0 auto;                
            }

            #container1 {
                width: 100%;
                height: 400px;
                margin: 0 auto;
                background-color: rgb(165, 255, 248);
                float: left;
                
                
            }

            #container2 {
                width: 1200px;
                height: 362.5px;
                background-color: rgb(194, 191, 191);
                float: left;
            }

            .o {
                width: 262.5px;
                height: 262.5px;
                background-color: aliceblue;
                border-radius: 50%;
                float: left;
                margin: 50px 50px 50px 0 ;
                
            }

            .o:last-child {
                margin-right: 0;
            }

            #container3{
                width: 1200px;
                height: 1800px;
                background-color: rgb(214, 214, 214);
                float: left;
            }

            .sq {
                width: 386.667px;
                height: 1600px;
                float: left;
            }

            .sq:nth-child(2) {
                margin: 0px 20px;
                float: left;
            }

            .sq1 {
                width: 100%;
                height: 500px;
                background-color: aliceblue;
                margin-bottom: 50px;
            }

            .sq2 {
                width: 100%;
                height: 600px;
                background-color: aliceblue;
                margin-bottom: 50px;
            }

            #btn {
                width: 50px;
                height: 50px;
                background-color: brown;
                position: fixed;
                bottom: 50px;
                right: 50px;
                text-align: center; 
                font:25px / 50px '';
                color: black
            }

                        
         /* SECTION END */

            footer {
                width: 100%;
                height: 200px;
                background-color: aquamarine;
                float: left;
                margin: 0 auto;
            }

    

        </style>
    </head>
    <body>
        <div id="wrap">
            <header>
                <div id="in_header">
                    <ul id="menu_wrap">
                        <a href="#"><li id="logo" >LOGO </li></a>
                        <a href="#"><li class="menu">menu</li></a>
                        <a href="#"><li class="menu">menu</li></a>
                        <a href="#"><li class="menu">menu</li></a>
                        <a href="#"><li class="menu">menu</li></a>
                        <a href="#"><li class="menu">menu</li></a>
                        
                    </ul>
                </div>
            </header>
            
            <section >
                <div id="container1"></div>
            
                <div id="container2">
                    <div class="o"></div>
                    <div class="o"></div>
                    <div class="o"></div>
                    <div class="o"></div>
                </div>

                <div id="container3">
                    <div class="sq">
                        <div class="sq1"></div>
                        <div class="sq2"></div>
                        <div class="sq1"></div>
                    </div> 

                    <div class="sq">
                        <div class="sq1"></div>
                        <div class="sq1"></div>
                        <div class="sq2"></div>
                    </div> 

                    <div class="sq">
                        <div class="sq1"></div>
                        <div class="sq2"></div>
                        <div class="sq1"></div>
                    </div>
                </div>
            
            </section>
            


            <footer></footer>


            <a href="#">
                <div id="btn">TOP</div>
            </a>

        </div>







        
        
    </body>
</html>
