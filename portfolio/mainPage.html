<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LKJoo Portfolio</title>
        <script>
            window.__portfolioHomeEntryFade = false;
            try {
                window.__portfolioHomeEntryFade = sessionStorage.getItem('portfolioHomeEntryFade') === '1';
                sessionStorage.removeItem('portfolioHomeEntryFade');
            } catch (_) {}
            if (window.__portfolioHomeEntryFade) {
                document.documentElement.classList.add('portfolio-home-entry-pending');
                window.addEventListener('DOMContentLoaded', () => {
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        window.setTimeout(() => {
                            document.documentElement.classList.add('portfolio-home-entry-ready');
                            const homeWrap = document.querySelector('body.page-home #wrap');
                            if (!homeWrap) return;
                            const clearEntryState = (event) => {
                                if (event.target !== homeWrap || (event.propertyName !== 'opacity' && event.propertyName !== 'transform')) return;
                                document.documentElement.classList.remove('portfolio-home-entry-pending', 'portfolio-home-entry-ready');
                                homeWrap.removeEventListener('transitionend', clearEntryState);
                            };
                            homeWrap.addEventListener('transitionend', clearEntryState);
                        }, 200);
                    }));
                }, { once: true });
            }
        </script>

    <style>

        *{

            padding: 0;

        }

        }

        ::selection {

            color: white;

            color: white;
        }

        #wrap .marquee h1::selection,
        #wrap .marquee h1 *::selection,

        body {

        }

        #custom-cursor {
            position: fixed;
            z-index: 9999;
            width: 18px;
            height: 18px;
            border: none;
            background-color: white;
            mix-blend-mode: difference;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: width 0.1s ease, height 0.1s ease, opacity 0.1s ease;
        }

        #custom-cursor.is-visible {
            opacity: 1;
        }

        #custom-cursor.is-clicking {
            width: 40.5px;
            height: 40.5px;
            background-color: royalblue;
        }

        #custom-cursor.is-tv-hover {
            width: 54px;
            height: 54px;
            background-color: royalblue;
            mix-blend-mode: difference;
        }

        #circle-visit-label {
            position: fixed;
            z-index: 10000;
            display: grid;
            width: 54px;
            height: 54px;
            place-items: center;
            color: #fff;
            font: 800 10.35px/1 'Noto Sans', sans-serif;
            letter-spacing: 2.07px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%);

        }

        #circle-visit-label::after {

        }

        #wrap {

            overflow: hidden;
            width: 100%;
            height: 100vh;
            background-color: white;
        }

        #wrap {
            transition: opacity 520ms ease, transform 520ms ease;

        html.portfolio-home-entry-pending body.page-home #wrap {
            opacity: 0;
            transform: translateY(10px);
        }

        html.portfolio-home-entry-ready body.page-home #wrap {
            opacity: 1;
            transform: none;
        }

        body.page-home.page-leaving #wrap {

            transform: translateY(-10px) scale(0.995);
            pointer-events: none;
        }

        body.page-home.page-leaving #custom-cursor {
            opacity: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            #wrap { transition-duration: 1ms; }

    <body class="page-home">

                        video.pause();
                        video.removeAttribute('src');
                        video.preload = 'none';
                    });
                }
            </script>

            <section>
                <div class="marquee">
                    <div class="marquee-track">
                        <div class="marquee-group">
                            <h1>Web Publisher Portfolio<span class="name"><span class="L">L</span>eeKIjoo</span></h1>

                        <div class="marquee-group" aria-hidden="true">

                        <a href="aboutMe.html"><div class="con"><div id="con_txt_left">About me</div></div></a>

        <script>
            const homeTransitionLinks = [...document.querySelectorAll('#con_wrap a[href]')];
            let homeTransitionStarted = false;

            homeTransitionLinks.forEach((link) => {
                link.addEventListener('click', (event) => {
                    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                    if (link.target && link.target !== '_self') return;
                    if (homeTransitionStarted) {
                        event.preventDefault();
                        return;
                    }

                    const destination = new URL(link.href, window.location.href);
                    if (destination.origin !== window.location.origin || !destination.pathname.endsWith('/aboutMe.html')) return;

                    event.preventDefault();
                    homeTransitionStarted = true;
                    const isContactDestination = destination.hash === '#contact-section';
                    try { sessionStorage.removeItem('portfolioContactEntryDelay'); } catch (_) {}
                    try { sessionStorage.removeItem('portfolioProjectEntryDelay'); } catch (_) {}
                    if (!isContactDestination) {
                        try { sessionStorage.setItem('portfolioAboutEntryFade', '1'); } catch (_) {}
                        if (destination.hash === '#projects_sec') {
                            try { sessionStorage.setItem('portfolioProjectEntryDelay', '1'); } catch (_) {}
                        }
                    } else {
                        try { sessionStorage.removeItem('portfolioAboutEntryFade'); } catch (_) {}
                        try { sessionStorage.setItem('portfolioContactEntryDelay', '1'); } catch (_) {}
                    }
                    document.body.classList.add('page-leaving');

                    const navigate = () => window.location.assign(destination.href);
                    const fallback = window.setTimeout(navigate, 650);
                    const homeWrap = document.querySelector('#wrap');
                    const finishTransition = (transitionEvent) => {
                        if (transitionEvent.target !== transitionEvent.currentTarget || transitionEvent.propertyName !== 'opacity') return;
                        window.clearTimeout(fallback);
                        homeWrap.removeEventListener('transitionend', finishTransition);
                        navigate();
                    };
                    homeWrap.addEventListener('transitionend', finishTransition);
                });
            });

            const firstCon = document.querySelector('#con_wrap > a:first-child .con');
            const secondCon = document.querySelector('#con_wrap > a:nth-child(2) .con');
            const thirdCon = document.querySelector('#con_wrap > a:nth-child(3) .con');
            const wrap = document.querySelector('#wrap');
            const firstVideo = document.querySelector('#bg-video');
            const secondVideo = document.querySelector('#bg-video-2');
            const thirdVideo = document.querySelector('#bg-video-3');
            const customCursor = document.querySelector('#custom-cursor');
            const circleVisitLabel = document.querySelector('#circle-visit-label');
            const conWrap = document.querySelector('#con_wrap');
            let resetTimer;
            let secondResetTimer;
            let thirdResetTimer;

            setTimeout(() => {
                requestAnimationFrame(() => {
                    conWrap.classList.add('intro-moving');
                });

                setTimeout(() => {
                    conWrap.classList.add('intro-center-moving');
                }, 900);

                setTimeout(() => {
                    conWrap.classList.add('intro-ready');
                }, 1350);
            }, 200);

            conWrap.addEventListener('click', (event) => {
                if (conWrap.classList.contains('intro-ready')) return;
                event.preventDefault();
                event.stopImmediatePropagation();
            }, true);

            document.addEventListener('mousemove', (event) => {
                customCursor.style.left = `${event.clientX}px`;
                customCursor.style.top = `${event.clientY}px`;
                circleVisitLabel.style.left = `${event.clientX}px`;
                circleVisitLabel.style.top = `${event.clientY}px`;
                customCursor.classList.add('is-visible');

                const hoveredElement = document.elementFromPoint(event.clientX, event.clientY);
                const hoveredAnchor = hoveredElement?.closest('a');
                const isInsideCircle = Boolean(hoveredElement?.closest('#con_wrap > a'));
                const isInsideAnchor = Boolean(hoveredAnchor);

                const isIntroActive = !conWrap.classList.contains('intro-ready');
                const isCircleVisit = !isIntroActive && isInsideCircle;
                customCursor.classList.toggle(
                    'is-tv-hover',
                    isCircleVisit
                );
                customCursor.classList.toggle(
                    'is-clicking',
                    !isIntroActive && isInsideAnchor && !isInsideCircle
                );
                circleVisitLabel.classList.toggle('is-visible', isCircleVisit);
            });

            document.addEventListener('mouseleave', () => {
                customCursor.classList.remove('is-clicking');
                customCursor.classList.remove('is-tv-hover');
                circleVisitLabel.classList.remove('is-visible');
            });

            firstCon.addEventListener('mouseenter', () => {
                if (!conWrap.classList.contains('intro-ready')) return;
                clearTimeout(resetTimer);
                wrap.classList.add('is-playing');
                firstVideo.play();
            });

            firstCon.addEventListener('mouseleave', () => {
                wrap.classList.remove('is-playing');
                resetTimer = setTimeout(() => {
                    firstVideo.pause();
                    firstVideo.currentTime = 0;
                }, 300);
            });

            secondCon.addEventListener('mouseenter', () => {
                if (!conWrap.classList.contains('intro-ready')) return;
                clearTimeout(secondResetTimer);
                secondVideo.currentTime = 0;
                const revealSecondVideo = () => {
                    if (secondCon.matches(':hover')) wrap.classList.add('is-playing-2');
                };
                secondVideo.play().then(() => {
                    if ('requestVideoFrameCallback' in secondVideo) {
                        secondVideo.requestVideoFrameCallback(revealSecondVideo);
                    } else setTimeout(revealSecondVideo, 80);
                });
            });

            secondCon.addEventListener('mouseleave', () => {
                wrap.classList.remove('is-playing-2');
                secondResetTimer = setTimeout(() => {
                    secondVideo.pause();
                    secondVideo.currentTime = 0;
                }, 300);
            });

            thirdCon.addEventListener('mouseenter', () => {
                if (!conWrap.classList.contains('intro-ready')) return;
                clearTimeout(thirdResetTimer);
                thirdVideo.currentTime = 0;
                const revealThirdVideo = () => {
                    if (thirdCon.matches(':hover')) {
                        wrap.classList.add('is-playing-3');
                    }
                };

                thirdVideo.play().then(() => {
                    if ('requestVideoFrameCallback' in thirdVideo) {
                        thirdVideo.requestVideoFrameCallback(revealThirdVideo);
                    } else {
                        setTimeout(revealThirdVideo, 80);
                    }
                });
            });

            thirdCon.addEventListener('mouseleave', () => {
                wrap.classList.remove('is-playing-3');
                thirdResetTimer = setTimeout(() => {
                    thirdVideo.pause();
                    thirdVideo.currentTime = 0;
                }, 300);
            });
            // 첫 번째 텍스트 그룹의 실제 너비를 기준으로 끊김 없이 반복합니다.
            const marqueeTrack = document.querySelector('.marquee-track');
            const marqueeGroup = document.querySelector('.marquee-group');
            const marquee = document.querySelector('.marquee');
            const marqueeSelectionLayer = document.createElement('div');
            marqueeSelectionLayer.setAttribute('aria-hidden', 'true');
            document.body.appendChild(marqueeSelectionLayer);
            let marqueeX = 0;
            let marqueeTime = performance.now();

            const updateMarqueeSelection = () => {
                marqueeSelectionLayer.replaceChildren();
                const selection = window.getSelection();

                if (!selection || selection.isCollapsed || !selection.rangeCount) {
                    return;
                }

                const range = selection.getRangeAt(0);
                const marqueeRect = marquee.getBoundingClientRect();

                if (!marquee.contains(range.commonAncestorContainer)) {
                    return;
                }

                [...range.getClientRects()].forEach((rect) => {
                    const overlapsMarquee = rect.right > marqueeRect.left &&
                        rect.left < marqueeRect.right &&
                        rect.bottom > marqueeRect.top &&
                        rect.top < marqueeRect.bottom;

                    if (!overlapsMarquee || rect.width === 0 || rect.height === 0) {
                        return;
                    }

                    const background = document.createElement('div');
                    background.className = 'marquee-selection-bg';
                    background.style.left = `${rect.left}px`;
                    background.style.top = `${rect.top}px`;
                    background.style.width = `${rect.width}px`;
                    background.style.height = `${rect.height}px`;
                    marqueeSelectionLayer.appendChild(background);
                });
            };

            document.addEventListener('selectionchange', updateMarqueeSelection);
            window.addEventListener('resize', updateMarqueeSelection);
            window.addEventListener('scroll', updateMarqueeSelection, { passive: true });

            const moveMarquee = (now) => {
                const elapsed = now - marqueeTime;
                marqueeTime = now;
                const loopWidth = marqueeGroup.getBoundingClientRect().width;
                const speed = (loopWidth / 16000) * 0.7;

                if (loopWidth > 0) {
                    marqueeX = (marqueeX - speed * elapsed) % loopWidth;
                    marqueeTrack.style.transform = `translate3d(${marqueeX}px, 0, 0)`;
                }

                requestAnimationFrame(moveMarquee);
            };

            requestAnimationFrame(moveMarquee);
        </script>
