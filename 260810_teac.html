<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            * {
                padding: 0;
                margin: 0;
            }

            input {
                display: none;
            }

            #wrap {
                width: 36.4583vw;
                height: 400px;
                border: 10px solid black;
                margin: 100px auto;
                text-align: center;
            }

            #label_wrap {
                width: 30%;
                height: 100%;
                background-color: antiquewhite;
                float: left;
            }

            label {
                display: block;
                width: 100%;
                height: 25%;
                font: 30px / 100px '';
            }

            .con {
                width: 70%;
                height: 100%;
                float: left;
                display: none;
                text-align: center;
                font: 900 2.6041vw / 400px '';

            }

            #con1 {
                background-color: pink;
            }

            #con2 {
                background-color: green;
            }

            #con3 {
                background-color: turquoise;
            }

            #con4 {
                background-color: tomato;
            }


            /* 버튼 눌렀을대 탭 메뉴 열리게 */

            #tab1:checked~#con1 {
                display: block;
            }

            #tab2:checked~#con2 {
                display: block;
            }

            #tab3:checked~#con3 {
                display: block;
            }

            #tab4:checked~#con4 {
                display: block;
            }

            #tab1:checked~#label_wrap #btn1 {
                background-color: pink;
            }

            #tab2:checked~#label_wrap #btn2 {
                background-color: green;

            }

            #tab3:checked~#label_wrap #btn3 {                
                background-color: turquoise;

            }

            #tab4:checked~#label_wrap #btn4 {
                background-color: tomato;

            }

        </style>
    </head>
    <body>
        <div id="wrap">
            <input type="radio" id="tab1" name="tab" checked>
            <input type="radio" id="tab2" name="tab" >
            <input type="radio" id="tab3" name="tab" >
            <input type="radio" id="tab4" name="tab" >

            <div id="label_wrap">
                <label for="tab1" id="btn1">1</label>
                <label for="tab2" id="btn2">2</label>
                <label for="tab3" id="btn3">3</label>
                <label for="tab4" id="btn4">4</label>
            </div>

            <div class="con" id="con1">첫번째</div>
            <div class="con" id="con2">두번째</div>
            <div class="con" id="con3">세번째</div>
            <div class="con" id="con4">네번째</div>
        </div>
    </body>
</html>
