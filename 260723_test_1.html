<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .box{
                width: 150px;
                height: 150px;
                position: absolute;
                top: 0;
                bottom: 0;
                animation: boxpingpong 2s infinite alternate;
                opacity: 0;
            }

            #box1 {
                background-color: rgb(255, 199, 47);
            }

            #box2 {
                background-color: rgb(255, 110, 110);
                animation-delay: 0.4s;
            }

            #box3 {
                background-color: cadetblue;
                animation-delay: 1s;
            }

            #box4 {
                background-color: rgb(10, 255, 34);
                animation-delay: 0.8s;
            }
            @keyframes boxpingpong {
                0%{
                    top: 0;
                    left: 0;
                    opacity: 0; ;
                }

                50%{
                    top: 500px;
                    left: 500px;
                    opacity: 0.5;
                    border-radius: 25%; ;
                }
                100%{
                    top: 0;
                    left: 890px;
                    opacity: 1;
                    border-radius: 50%;
                }

            }

        </style>







    </head>
    <body>
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>

    </body>
</html>
