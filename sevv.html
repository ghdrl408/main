<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구조선택자</title>
    <style>
        ul li:first-child {
            color: crimson;
            font-size: 50px;

        }

        ul li:last-child {
            border: 5px solid tomato;
        }

        ul li:nth-child(2) {
            background-color: blueviolet;
        }

        ul li:nth-child(2n) {
            border: 5px solid navy;
        }

        ul li:not(:nth-child(3)) {
            border: 1px solid black
        }

        /* #dd {
            border: 2px solid yellow;
        } 
        */
        h1:first-of-type {
            color: red;
        }

        h3:first-of-type {
            font-size: 35px;
            color: darkblue;
            font-style: italic;
        }


        * {
            padding: 0;
            margin: 0;
        }

        .box {
            width: 500px;
            height: 200px;
            border: 2px solid black;
            background-color: yellow;
            box-sizing: border-box;
            margin: 20px;
            text-align: center;
        }

        #box2 {
            background-color: plum;
            width: 400px;
            height: 150px;
        }

        #box3 {
            background-color: rgb(7, 71, 27);
            height: 80px;
            width: 300px;
            line-height: 80px;
        }
    </style>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li id="ee">8</li>
    </ul>

    <h1>head</h1>
    <h2>head2</h2>
    <h3>head3</h3>
    <h3>head3</h3>
    <h3>head3</h3>
    <h3>head3</h3>
    <h1>head</h1>
    <h2>head2</h2>

    <div class="box" id="box1">
        <div class="box" id="box2">
            <div class="box" id="box3">네모네모네네</div>
        </div>
    </div>

</body>

</html>

<!-- 
    <구조선택자>
    -일반 구조 선택자 : 형제 관계에 있는 요소들 중 특정 요소(태그)를 선택하는 선택자
        1) first-child : 첫번째 자식 선택
        2) last-child : 마지막 자식 선택
        3) nth-child(+숫자) : N번째 자식 선택
        4) nth-child(2n) : 짝수번째 / nth-child(2n-1, 2n+1) :홀수번째
            nth-child(even) : 짝수 / nth-child(odd) : 홀수
        > last-child 의 경우 가장 아래에 있어서 n번째 태그입력이랑 겹쳐지면 안나오게됨
        5) not () : 특정 선택자()빼고 나머지는 디자인을 들어가게 적용

  
    -형태 구조 선택자 : 
        1) first-of-type : 형제 중에 첫번째로 나오는 특정 태그를 선택
        2) last-of-type : 형제중에 마지막으로 나오는 특정 태그를 선택
        3)nth-of-type : 형제중에 N번째로 나오는 특정 태그를 선택



    **선택자를 2개 이상 동시에 사용시 선택자 사이에 ,(콤마) 로 구분
        > ex) ul, li {
            list-style : none;}





-->
