<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
 
           




            #wrap {
                width: 800px;
                height: 600px;
                border: 30px solid tomato;
                background-color: blue;
                position: absolute;
                top: 50%;
                left: 50%;
                margin-top: -300px;
                margin-left: -400px;

            }

            #clouds {
                width: 600px;
                height: 300px;
                position: relative;
                margin: 150px auto;
            }


            .circle {
                width: 200px;
                height: 200px;
                border-radius: 50%;
                position: absolute;
            }

            #circle1 {
                background-color: aqua;
                top: 50px;
                left: 0;
            }

            #circle2 {
                width: 300px;
                height: 300px;
                background-color: rgb(46, 243, 89);
                top: 50%;
                left: 50%;
                margin-top: -150px;
                margin-left: -150px;
                z-index: +10;
            }

            #circle3 {
                background-color: rgb(128, 241, 241);
                top: 50px;
                right: 0;
            }
            

        </style>
    </head>
    <body>
        
            

            <div id="wrap">
                <div id="clouds">
                    <div class="circle" id="circle1"></div>
                    <div class="circle" id="circle2"></div>
                    <div class="circle" id="circle3"></div>
                </div>
            </div>
    </body>
</html>
